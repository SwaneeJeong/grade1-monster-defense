/* =========================================================
   ✂️ 얼굴 맞추기 (face crop)
   고른 사진을 .hero-head(56:68) 모양 타원 안에 직접 맞춰 자른다
   ========================================================= */
var CROP_RW = 56, CROP_RH = 68;          /* .hero-head 비율 */
var CROP_OUT_W = 180, CROP_OUT_H = 218;  /* 저장 크기 */
var CROP_OVERSCAN = 1.1;                 /* 1.0x에서도 손가락으로 밀 여유 */

var Crop = {
  modal: null, stage: null, img: null, guide: null, rng: null, valEl: null,
  open: false, iw: 0, ih: 0, cover: 1, baseW: 0, baseH: 0,
  scale: 1, tx: 0, ty: 0,
  size: 260, gw: 0, gh: 0, gx: 0, gy: 0, px: 0, py: 0, k: 1,
  url: '', ptrs: [], lastDist: 0, prevFocus: null
};

function cropResetInput(){
  var inp = $('heroPhotoInput');
  if(inp){ try{ inp.value = ''; }catch(e){} }
}

/* 타원 가이드 크기 맞추기 (무대 크기에 맞춰 비율 유지) */
function cropMeasure(){
  if(!Crop.stage || !Crop.guide) return;
  var s = Crop.stage.clientWidth || 260;
  Crop.size = s;
  Crop.gh = Math.round(Math.min(s - 22, s * 0.84));
  Crop.gw = Math.round(Crop.gh * CROP_RW / CROP_RH);
  Crop.gx = Math.round((s - Crop.gw) / 2);
  Crop.gy = Math.round((s - Crop.gh) / 2);
  Crop.guide.style.left = Crop.gx + 'px';
  Crop.guide.style.top = Crop.gy + 'px';
  Crop.guide.style.width = Crop.gw + 'px';
  Crop.guide.style.height = Crop.gh + 'px';
}

/* 무대 안에서 사진이 차지하는 위치·배율 */
function cropRender(){
  if(!Crop.img) return;
  var s = Crop.scale;
  var w = Crop.baseW * s, h = Crop.baseH * s;
  var px = (Crop.size - w) / 2 + Crop.tx;
  var py = (Crop.size - h) / 2 + Crop.ty;
  Crop.px = px; Crop.py = py;
  Crop.k = Crop.cover * s;                 /* 원본 픽셀 → 무대 픽셀 */
  Crop.img.style.width = Crop.baseW + 'px';
  Crop.img.style.height = Crop.baseH + 'px';
  Crop.img.style.transform = 'translate(' + px + 'px,' + py + 'px) scale(' + s + ')';
}

/* 타원 밖으로 사진이 빠져나가지 않게 */
function cropClamp(){
  var s = Crop.scale;
  var mw = Math.max(0, (Crop.baseW * s - Crop.gw) / 2);
  var mh = Math.max(0, (Crop.baseH * s - Crop.gh) / 2);
  Crop.tx = clamp(Crop.tx, -mw, mw);
  Crop.ty = clamp(Crop.ty, -mh, mh);
}

function cropSyncZoom(){
  var s = Crop.scale;
  if(Crop.rng) Crop.rng.value = String(Math.round(s * 100) / 100);
  if(Crop.valEl) Crop.valEl.textContent = (Math.round(s * 10) / 10).toFixed(1) + 'x';
}

/* (lx,ly) 지점을 고정한 채 목표 배율로 */
function cropZoomTo(target, lx, ly){
  target = clamp(target, 1, 4);
  if(lx === undefined || lx === null){ lx = Crop.size / 2; ly = Crop.size / 2; }
  if(Math.abs(target - Crop.scale) < 0.0005) return;
  var r = (Crop.cover * target) / (Crop.cover * Crop.scale);
  var pxNew = lx - (lx - Crop.px) * r;
  var pyNew = ly - (ly - Crop.py) * r;
  Crop.scale = target;
  Crop.tx = pxNew - (Crop.size - Crop.baseW * target) / 2;
  Crop.ty = pyNew - (Crop.size - Crop.baseH * target) / 2;
  cropClamp(); cropRender(); cropSyncZoom();
}

function cropStagePoint(ev){
  var r = Crop.stage.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

function cropOpen(file){
  if(!Crop.modal || !Crop.stage || !Crop.img) return;
  var url;
  try{ url = URL.createObjectURL(file); }catch(e){ heroToast('사진을 읽지 못했어요'); cropResetInput(); return; }
  var probe = new Image();
  var done = false;
  probe.onload = function(){
    if(done) return; done = true;
    var iw = probe.naturalWidth || probe.width || 0;
    var ih = probe.naturalHeight || probe.height || 0;
    if(!iw || !ih){ heroToast('사진을 읽지 못했어요'); try{ URL.revokeObjectURL(url); }catch(e){} cropResetInput(); return; }
    Crop.iw = iw; Crop.ih = ih;
    Crop.url = url;
    Crop.img.src = url;
    Crop.scale = 1; Crop.tx = 0; Crop.ty = 0;
    Crop.ptrs = []; Crop.lastDist = 0;
    Crop.prevFocus = document.activeElement;
    Crop.modal.hidden = false;
    Crop.open = true;
    cropMeasure();
    Crop.cover = Math.max(Crop.gw / Crop.iw, Crop.gh / Crop.ih) * CROP_OVERSCAN;
    Crop.baseW = Crop.iw * Crop.cover;
    Crop.baseH = Crop.ih * Crop.cover;
    cropClamp(); cropRender(); cropSyncZoom();
    Sfx.unlock(); Sfx.tap();
    try{ $('cropApply').focus(); }catch(e){}
  };
  probe.onerror = function(){
    if(done) return; done = true;
    heroToast('사진을 읽지 못했어요');
    try{ URL.revokeObjectURL(url); }catch(e){}
    cropResetInput();
  };
  probe.src = url;
}

function cropClose(){
  if(!Crop.modal) return;
  Crop.modal.hidden = true;
  Crop.open = false;
  Crop.ptrs = []; Crop.lastDist = 0;
  if(Crop.url){ try{ URL.revokeObjectURL(Crop.url); }catch(e){} Crop.url = ''; }
  try{ Crop.img.removeAttribute('src'); }catch(e){}
  if(Crop.stage) Crop.stage.classList.remove('grabbing');
  cropResetInput();
  var f = Crop.prevFocus; Crop.prevFocus = null;
  if(f && f.focus){ try{ f.focus(); }catch(e){} }
}

function cropCancel(){
  cropClose();
  Sfx.tap();
}

/* 타원 안에 보이는 그대로를 180x218 JPEG(0.88)로 잘라 저장 */
function cropApply(){
  if(!Crop.open || !Crop.iw || !Crop.ih) return;
  try{
    var sx = (Crop.gx - Crop.px) / Crop.k;
    var sy = (Crop.gy - Crop.py) / Crop.k;
    var sw = Crop.gw / Crop.k;
    var sh = Crop.gh / Crop.k;

    var x0 = Math.max(0, sx), y0 = Math.max(0, sy);
    var x1 = Math.min(Crop.iw, sx + sw), y1 = Math.min(Crop.ih, sy + sh);
    if(x1 - x0 < 2 || y1 - y0 < 2){ heroToast('사진을 읽지 못했어요'); return; }

    var cv = document.createElement('canvas');
    cv.width = CROP_OUT_W;
    cv.height = CROP_OUT_H;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, CROP_OUT_W, CROP_OUT_H);
    cx.imageSmoothingEnabled = true;
    if('imageSmoothingQuality' in cx) cx.imageSmoothingQuality = 'high';

    var dxs = CROP_OUT_W / sw, dys = CROP_OUT_H / sh;
    cx.drawImage(Crop.img,
      x0, y0, x1 - x0, y1 - y0,
      (x0 - sx) * dxs, (y0 - sy) * dys, (x1 - x0) * dxs, (y1 - y0) * dys);

    var url = cv.toDataURL('image/jpeg', 0.88);
    if(!url || url.indexOf('data:image/jpeg') !== 0){ heroToast('사진을 저장하지 못했어요'); return; }
    if(!Store.set(PHOTO_KEY, url)){ heroToast('사진을 저장하지 못했어요 (저장 공간 부족)'); return; }
    applyHeroPhoto(url);
    cropClose();
    Sfx.correct(3);
    heroToast('얼굴 맞췄어요! 미사일 발사 준비 🚀');
  }catch(e){
    heroToast('사진을 저장하지 못했어요');
  }
}

function cropInit(){
  Crop.modal = $('cropModal');
  Crop.stage = $('cropStage');
  Crop.img = $('cropImg');
  Crop.guide = $('cropGuide');
  Crop.rng = $('cropZoom');
  Crop.valEl = $('cropZoomVal');
  if(!Crop.modal || !Crop.stage || !Crop.img) return;

  var bCancel = $('cropCancel'), bApply = $('cropApply'), bOut = $('cropZoomOut'), bIn = $('cropZoomIn');
  if(bCancel) bCancel.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); cropCancel(); });
  if(bApply) bApply.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); cropApply(); });
  if(bOut) bOut.addEventListener('click', function(ev){ ev.preventDefault(); cropZoomTo(Crop.scale - 0.2); });
  if(bIn) bIn.addEventListener('click', function(ev){ ev.preventDefault(); cropZoomTo(Crop.scale + 0.2); });
  if(Crop.rng) Crop.rng.addEventListener('input', function(){ cropZoomTo(parseFloat(Crop.rng.value)); });

  /* 끌기 + 두 손가락 확대 */
  Crop.stage.addEventListener('pointerdown', function(ev){
    if(!Crop.open) return;
    ev.preventDefault();
    try{ Crop.stage.setPointerCapture(ev.pointerId); }catch(e){}
    Crop.ptrs.push({ id: ev.pointerId, x: ev.clientX, y: ev.clientY });
    Crop.stage.classList.add('grabbing');
    if(Crop.ptrs.length === 2){
      var a = Crop.ptrs[0], b = Crop.ptrs[1];
      Crop.lastDist = Math.sqrt(Math.pow(b.x - a.x, 2) + Math.pow(b.y - a.y, 2));
    }
  });

  Crop.stage.addEventListener('pointermove', function(ev){
    if(!Crop.open) return;
    var i = -1;
    for(var j=0;j<Crop.ptrs.length;j++){ if(Crop.ptrs[j].id === ev.pointerId){ i = j; break; } }
    if(i < 0) return;
    var p = Crop.ptrs[i];
    var dx = ev.clientX - p.x, dy = ev.clientY - p.y;
    p.x = ev.clientX; p.y = ev.clientY;
    ev.preventDefault();
    if(Crop.ptrs.length >= 2){
      var a = Crop.ptrs[0], b = Crop.ptrs[1];
      var d = Math.sqrt(Math.pow(b.x - a.x, 2) + Math.pow(b.y - a.y, 2));
      var pt = cropStagePoint(ev);
      if(Crop.lastDist > 0 && d > 0) cropZoomTo(Crop.scale * (d / Crop.lastDist), pt.x, pt.y);
      Crop.lastDist = d;
      Crop.tx += dx / 2; Crop.ty += dy / 2;
    } else {
      Crop.tx += dx; Crop.ty += dy;
    }
    cropClamp(); cropRender();
  });

  function ptrEnd(ev){
    for(var j=0;j<Crop.ptrs.length;j++){
      if(Crop.ptrs[j].id === ev.pointerId){ Crop.ptrs.splice(j, 1); break; }
    }
    Crop.lastDist = 0;
    if(!Crop.ptrs.length) Crop.stage.classList.remove('grabbing');
    try{ Crop.stage.releasePointerCapture(ev.pointerId); }catch(e){}
  }
  Crop.stage.addEventListener('pointerup', ptrEnd);
  Crop.stage.addEventListener('pointercancel', ptrEnd);

  Crop.stage.addEventListener('wheel', function(ev){
    if(!Crop.open) return;
    ev.preventDefault();
    var pt = cropStagePoint(ev);
    cropZoomTo(Crop.scale * (ev.deltaY < 0 ? 1.08 : 0.925), pt.x, pt.y);
  }, { passive: false });

  /* 바깥(어두운 곳) 누르면 취소 */
  Crop.modal.addEventListener('pointerdown', function(ev){
    if(ev.target === Crop.modal) cropCancel();
  });

  document.addEventListener('keydown', function(ev){
    if(!Crop.open) return;
    if(ev.key === 'Escape'){ ev.preventDefault(); cropCancel(); }
  });

  window.addEventListener('resize', function(){
    if(!Crop.open || !Crop.iw) return;
    cropMeasure();
    Crop.cover = Math.max(Crop.gw / Crop.iw, Crop.gh / Crop.ih) * CROP_OVERSCAN;
    Crop.baseW = Crop.iw * Crop.cover;
    Crop.baseH = Crop.ih * Crop.cover;
    Crop.tx = 0; Crop.ty = 0;
    cropClamp(); cropRender(); cropSyncZoom();
  });
}

/* 고른 사진 → 얼굴 맞추기 창 */
function readHeroPhotoFile(file){
  if(!file) return;
  if(file.type && file.type.indexOf('image/') !== 0){ heroToast('사진 파일만 넣을 수 있어요'); cropResetInput(); return; }
  cropOpen(file);
}

/* =========================================================
   screens
   ========================================================= */
function refreshTitleBests(){
  var all = 0;
  var g = normGrade(S.gradeSel);
  var modes = ['math','word','mix'];
  for(var i=0;i<modes.length;i++){
    var v = bestOf(modes[i], g);
    if(v > all) all = v;
    var el = document.querySelector('[data-best="' + modes[i] + '"]');
    if(el) el.textContent = gradeTag(g) + ' 최고 ' + v + '점';
  }
  var be = $('bestAll');
  if(be) be.textContent = all;
  var info = GRADE_INFO[g];
  var sm = $('subMath');
  if(sm && info) sm.textContent = info.sub;
  var sx = $('subMix');
  if(sx) sx.textContent = gradeTag(g) + ' 수학(' + (S.mathType === 'choice' ? '객관식' : '주관식') + ') + 낱말';
}

function setGrade(g){
  S.gradeSel = normGrade(g);
  Store.set('gm_grade', S.gradeSel);
  var btns = document.querySelectorAll('.g-btn');
  for(var i=0;i<btns.length;i++){
    var gi = parseInt(btns[i].getAttribute('data-grade'), 10);
    if(gi === S.gradeSel) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  refreshTitleBests();
}

/* 몬스터 속도 — 🐢 느림 / 🏃 보통 / ⚡ 빠름 */
function setSpeed(v, silent){
  var prev = speedFactor();
  speedLevel = normSpeed(v);
  Store.set(SPEED_KEY, speedLevel);
  var btns = document.querySelectorAll('.spd-btn');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-speed') === speedLevel) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  /* 게임 중에 바꾸면 내려오고 있는 몹·보스의 속도도 바로 반영 */
  var next = speedFactor();
  if(prev > 0 && next !== prev && S.monsters && S.monsters.length){
    var r = next / prev;
    for(var j=0;j<S.monsters.length;j++){
      if(!S.monsters[j].dead) S.monsters[j].speed *= r;
    }
  }
  syncSpeedHud();
  if(!silent) Sfx.tap();
}

/* HUD의 속도 버튼 + 시작 화면 버튼 모양을 한 번에 맞춘다 */
function syncSpeedHud(){
  var b = $('btnSpeed');
  if(!b) return;
  var lb = SPEED_LABELS[speedLevel] || SPEED_LABELS.normal;
  var parts = lb.split(' ');
  var ico = parts[0] || '🏃';
  var txt = parts[1] || '보통';
  var ic = $('spdHudIco'), tl = $('spdHudLb');
  if(ic) ic.textContent = ico;
  if(tl) tl.textContent = txt;
  b.setAttribute('data-speed', speedLevel);
  b.setAttribute('aria-label', '몬스터 속도 바꾸기 (지금: ' + txt + ')');
}

/* 게임 중 HUD 버튼 — 느림 → 보통 → 빠름 → 느림 순서로 바꾸기 */
var SPEED_ORDER = ['slow','normal','fast'];
function cycleSpeed(){
  var i = SPEED_ORDER.indexOf(speedLevel);
  setSpeed(SPEED_ORDER[(i + 1) % SPEED_ORDER.length], true);
  Sfx.tap();
  speedToast('속도 ' + speedLabel());
}

function speedToast(msg){
  var el = $('spdToast');
  if(!el) return;
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(speedToast._t);
  speedToast._t = setTimeout(function(){ el.classList.remove('show'); }, 1100);
}

/* 수학 답 방식 — 주관식(숫자판) / 객관식(4지선다) */
function setMathType(t, silent){
  S.mathType = (t === 'choice') ? 'choice' : 'typein';
  Store.set('gm_math_type', S.mathType);
  var btns = document.querySelectorAll('.mt-btn');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('data-mt') === S.mathType) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
  refreshTitleBests();
  if(!silent) Sfx.tap();
}

function soundIcon(){
  var ic = Sfx.muted() ? '🔇' : '🔊';
  $('btnSound').textContent = ic;
  $('btnSoundTitle').textContent = ic;
}

function toTitle(){
  S.running = false;
  S.paused = false;
  S.targetId = null;
  for(var i=0;i<S.monsters.length;i++){
    if(S.monsters[i].el.parentNode) S.monsters[i].el.parentNode.removeChild(S.monsters[i].el);
  }
  S.monsters = [];
  S.monsters.length = 0;
  clearMissiles();
  elFx.innerHTML = '';
  hideOverlay();
  elGame.hidden = true;
  elTitle.hidden = false;
  refreshTitleBests();
  soundIcon();
}

function startGame(mode){
  Sfx.unlock();
  S.mode = mode;
  S.grade = normGrade(S.gradeSel);
  S.stage = 1;
  S.hearts = 5;
  S.score = 0;
  S.combo = 0;
  S.kills = 0;
  S.needKills = 8;
  S.input = '';
  S.targetId = null;
  S.manual = false;
  S.bossActive = false;
  S.stageDone = false;
  S.paused = false;
  S.spawnT = 1.3;
  S.best = bestOf(mode, S.grade);
  recentWords = [];

  for(var i=0;i<S.monsters.length;i++){
    if(S.monsters[i].el.parentNode) S.monsters[i].el.parentNode.removeChild(S.monsters[i].el);
  }
  S.monsters = [];
  clearMissiles();
  elFx.innerHTML = '';

  elTitle.hidden = true;
  elGame.hidden = false;
  hideOverlay();
  updateHud();
  soundIcon();
  showPanelFor(null);
  elPanelIdle.textContent = '몬스터를 기다리는 중…';

  var spdTag = (speedLevel === 'normal') ? '' : ' · ' + speedLabel();
  banner(heroName ? '출동! ' + heroName + ' 용사!' : '출동! 용사!',
         (S.mode === 'word' ? '낱말을 맞혀라!'
           : (gradeTag(S.grade) + ' 수학 ' + (S.mathType === 'choice' ? '객관식' : '주관식') + ' 시작!')) + spdTag, 1600);
  startLoop();
}

/* =========================================================
   start wiring
   ========================================================= */
var gradeBtns = document.querySelectorAll('.g-btn');
for(var gi=0;gi<gradeBtns.length;gi++){
  (function(btn){
    btn.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      Sfx.unlock();
      setGrade(btn.getAttribute('data-grade'));
      Sfx.tap();
    });
  })(gradeBtns[gi]);
}

var modeCards = document.querySelectorAll('.mode-card');
for(var i=0;i<modeCards.length;i++){
  (function(card){
    card.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      Sfx.unlock();
      startGame(card.getAttribute('data-mode'));
    });
  })(modeCards[i]);
}

$('btnSound').addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  Sfx.unlock();
  Sfx.toggle();
  soundIcon();
  if(!Sfx.muted()) Sfx.tap();
});
$('btnSoundTitle').addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  Sfx.unlock();
  Sfx.toggle();
  soundIcon();
  if(!Sfx.muted()) Sfx.tap();
});
$('btnPause').addEventListener('pointerdown', function(ev){
  ev.preventDefault();
  togglePause();
});

/* 주인공 사진 넣기 / 초기화 */
var heroFileInput = $('heroPhotoInput');
var btnHeroPhoto = $('btnHeroPhoto');
if(btnHeroPhoto && heroFileInput){
  btnHeroPhoto.addEventListener('click', function(ev){
    ev.preventDefault();
    Sfx.unlock();
    Sfx.tap();
    try{ heroFileInput.click(); }catch(e){}
  });
  heroFileInput.addEventListener('change', function(){
    var f = (heroFileInput.files && heroFileInput.files[0]) || null;
    if(!f){ return; }
    readHeroPhotoFile(f);
  });
}
cropInit();
var btnHeroReset = $('btnHeroReset');
if(btnHeroReset){
  btnHeroReset.addEventListener('click', function(ev){
    ev.preventDefault();
    Store.remove(PHOTO_KEY);
    applyHeroPhoto('');
    Sfx.tap();
    heroToast('기본 주인공으로 돌아왔어요');
  });
}

/* 게임 중 HUD 속도 버튼 */
var btnSpeedEl = $('btnSpeed');
if(btnSpeedEl){
  btnSpeedEl.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    Sfx.unlock();
    cycleSpeed();
  });
}

/* 속도 토글 (느림 / 보통 / 빠름) */
var spdBtns = document.querySelectorAll('.spd-btn');
for(var si=0;si<spdBtns.length;si++){
  (function(btn){
    btn.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      Sfx.unlock();
      setSpeed(btn.getAttribute('data-speed'));
    });
  })(spdBtns[si]);
}

/* 수학 답 방식 토글 (주관식 / 객관식) */
var mtBtns = document.querySelectorAll('.mt-btn');
for(var mi=0;mi<mtBtns.length;mi++){
  (function(btn){
    btn.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      Sfx.unlock();
      setMathType(btn.getAttribute('data-mt'));
    });
  })(mtBtns[mi]);
}

/* 🏷️ 주인공 이름 — 기기 안(localStorage)에만 저장 */
function saveHeroName(){
  var el = $('heroName');
  if(!el) return;
  var v = String(el.value || '').replace(/\s+/g, ' ').trim().slice(0, 10);
  heroName = v;
  if(v) Store.set(NAME_KEY, v); else Store.remove(NAME_KEY);
}
var nameEl = $('heroName');
if(nameEl){
  nameEl.value = loadHeroName();
  nameEl.addEventListener('input', saveHeroName);
  nameEl.addEventListener('change', function(){
    saveHeroName();
    if(heroName) heroToast('안녕, ' + heroName + ' 용사! 🚀');
    else heroToast('이름을 넣으면 게임에서 불러 줄게요');
  });
  nameEl.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); nameEl.blur(); }
  });
}

setMathType(Store.get('gm_math_type', 'typein'), true);
setGrade(Store.get('gm_grade', 1));
setSpeed(Store.get(SPEED_KEY, 'normal'), true);
applyHeroPhoto(heroPhotoUrl());
soundIcon();
if(heroName) setTimeout(function(){ heroToast('오늘도 출동! ' + heroName + ' 용사!'); }, 700);

})();
</script>
