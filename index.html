<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe9ff">
<title>수학·낱말 디펜스</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
*[hidden]{display:none!important;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#eaf6ff;}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:#22405f;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;
  overscroll-behavior:none;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}

/* ---------- title ---------- */
#screenTitle{
  align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#d6f0ff 0%,#eefaff 45%,#f7ffec 100%);
  padding:calc(8px + env(safe-area-inset-top)) 14px calc(8px + env(safe-area-inset-bottom));
}
.deco{position:absolute;font-size:clamp(18px,6vw,30px);opacity:.8;animation:floaty 5s ease-in-out infinite;pointer-events:none;}
.title-wrap{display:flex;flex-direction:column;gap:clamp(7px,1.8vh,13px);width:100%;max-width:560px;}
.logo{text-align:center;font-weight:900;color:#12324e;line-height:1.1;
  font-size:clamp(25px,8.4vw,44px);text-shadow:0 3px 0 #fff,0 8px 16px rgba(60,120,200,.22);}
.logo .sub{display:block;margin-top:6px;font-size:clamp(11px,3.4vw,15px);font-weight:800;color:#3b6ea8;letter-spacing:.5px;}
.mode-card{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:18px;padding:11px 14px;
  font-family:inherit;font-size:clamp(15px,4.6vw,21px);font-weight:900;color:#fff;text-align:left;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.16),0 10px 20px rgba(30,80,140,.18);transition:transform .07s,box-shadow .07s;}
.mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.16);}
.mode-card .mc-emoji{font-size:1.45em;line-height:1;}
.mode-card .mc-txt{flex:1;display:flex;flex-direction:column;line-height:1.18;}
.mode-card .mc-sub{font-size:.6em;font-weight:700;opacity:.92;margin-top:2px;}
.mode-card .mc-best{font-size:.58em;font-weight:800;background:rgba(255,255,255,.24);padding:3px 8px;border-radius:99px;white-space:nowrap;}
.m-math{background:linear-gradient(135deg,#4facfe,#2f7ff0);}
.m-word{background:linear-gradient(135deg,#ffa05a,#f4622f);}
.m-mix{background:linear-gradient(135deg,#a473ff,#6c3ef0);}
.title-foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(11px,3.4vw,14px);font-weight:800;color:#54759b;}
.title-foot .best-all{background:#fff;border:2px solid #d3e6fa;border-radius:99px;padding:4px 10px;}

/* ---------- hero photo setter (title) ---------- */
.hero-set{display:flex;align-items:center;gap:6px;width:100%;}
.hp-btn{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  border:2px solid #cfe3f8;border-radius:14px;padding:6px 9px;cursor:pointer;
  background:linear-gradient(#ffffff,#eef7ff);color:#2a5b96;font-family:inherit;font-weight:900;
  font-size:clamp(11px,3.3vw,14px);line-height:1.1;box-shadow:0 3px 0 #dbe9f8;
  transition:transform .07s,box-shadow .07s;}
.hp-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dbe9f8;}
.hp-ico,.hp-thumb{flex:0 0 auto;width:22px;height:22px;border-radius:50%;}
.hp-ico{display:flex;align-items:center;justify-content:center;font-size:13px;background:#eaf3ff;border:1.5px dashed #9cc7f0;}
.hp-thumb{display:none;background:#eaf3ff center/cover no-repeat;border:2px solid #7bb7ff;
  box-shadow:0 0 8px rgba(90,175,255,.7);}
.hp-btn.has .hp-thumb{display:block;}
.hp-btn.has .hp-ico{display:none;}
.hp-btn .hp-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hp-reset{flex:0 0 auto;border:2px solid #ffd0d0;background:#fff5f5;color:#c0392b;border-radius:12px;
  padding:7px 9px;font-family:inherit;font-weight:900;font-size:clamp(10px,3vw,13px);line-height:1;
  cursor:pointer;box-shadow:0 3px 0 #ffdada;}
.hp-reset:active{transform:translateY(2px);box-shadow:0 1px 0 #ffdada;}
.hero-file{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;}
.title-toast{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));z-index:320;
  transform:translate(-50%,8px);background:rgba(18,50,78,.93);color:#fff;font-weight:900;
  font-size:clamp(11px,3.3vw,14px);padding:8px 14px;border-radius:99px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 6px 18px rgba(10,40,80,.3);}
.title-toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 얼굴 맞추기 (face crop) ---------- */
.crop-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(9,29,50,.74);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  overscroll-behavior:contain;animation:cropFade .16s ease-out;}
@keyframes cropFade{from{opacity:0;}to{opacity:1;}}
.crop-card{width:100%;max-width:334px;background:linear-gradient(#ffffff,#f1f9ff);border-radius:24px;
  padding:13px 13px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 18px 44px rgba(4,20,40,.5),0 0 0 2px rgba(255,255,255,.5);
  animation:cropPop .2s cubic-bezier(.2,.9,.3,1.2);}
@keyframes cropPop{from{transform:scale(.94);opacity:.6;}to{transform:scale(1);opacity:1;}}
.crop-title{margin:0;font-size:clamp(15px,4.6vw,19px);font-weight:900;color:#12324e;text-align:center;line-height:1.2;
  letter-spacing:-.3px;}
.crop-hint{margin:-2px 0 1px;font-size:clamp(10px,3vw,12px);font-weight:800;color:#7191b4;text-align:center;line-height:1.35;}
.crop-stage{position:relative;width:min(260px,calc(100vw - 60px));aspect-ratio:1/1;border-radius:18px;
  overflow:hidden;background:#0d2237;touch-action:none;cursor:grab;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),0 6px 16px rgba(20,60,100,.25);}
.crop-stage.grabbing{cursor:grabbing;}
.crop-img{position:absolute;left:0;top:0;transform-origin:0 0;display:block;
  max-width:none;pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;}
.crop-guide{position:absolute;pointer-events:none;border-radius:46% 46% 50% 50%;
  border:3px dashed rgba(255,255,255,.96);
  box-shadow:0 0 0 9999px rgba(5,18,32,.6),
             inset 0 0 0 2px rgba(90,190,255,.85),
             inset 0 0 26px rgba(120,205,255,.55),
             0 0 18px rgba(120,205,255,.6);}
.crop-zoom{display:flex;align-items:center;gap:6px;width:min(260px,calc(100vw - 60px));}
.cz-ico{flex:0 0 auto;font-size:13px;line-height:1;}
.cz-btn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid #cfe3f8;background:#fff;
  color:#2a5b96;font-family:inherit;font-weight:900;font-size:16px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #dbe9f8;}
.cz-btn:active{transform:translateY(2px);box-shadow:0 0 0 #dbe9f8;}
.cz-range{flex:1 1 auto;min-width:0;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
  background:linear-gradient(90deg,#4facfe,#2f7ff0);outline:none;margin:0;cursor:pointer;}
.cz-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid #2f7ff0;box-shadow:0 2px 6px rgba(20,70,130,.35);}
.cz-range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #2f7ff0;}
.cz-val{flex:0 0 auto;min-width:34px;text-align:right;font-size:clamp(10px,3vw,12px);font-weight:900;color:#2a5b96;}
.crop-btns{display:flex;gap:8px;width:100%;margin-top:1px;}
.crop-btn{flex:1 1 0;border:0;border-radius:16px;padding:12px 8px;font-family:inherit;font-weight:900;
  font-size:clamp(13px,3.9vw,16px);line-height:1.1;cursor:pointer;transition:transform .07s,box-shadow .07s;}
.crop-btn.ghost{flex:0 0 34%;background:#eff6ff;color:#3a6ca8;box-shadow:0 4px 0 #d3e4f8;}
.crop-btn.go{background:linear-gradient(135deg,#4facfe,#2f7ff0);color:#fff;
  box-shadow:0 5px 0 #1f5cb3,0 8px 18px rgba(47,127,240,.35);}
.crop-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
@media (max-height:700px){
  .crop-stage{width:min(230px,calc(100vw - 60px));}
  .crop-zoom{width:min(230px,calc(100vw - 60px));}
  .crop-hint{display:none;}
}

/* ---------- grade selector ---------- */
.grade-row{display:flex;align-items:center;gap:4px;width:100%;}
.grade-cap{flex:0 0 auto;font-size:clamp(10px,3vw,13px);font-weight:900;color:#4b719c;
  background:#e8f3ff;border:1.5px solid #cfe3f8;border-radius:99px;padding:5px 7px;line-height:1;}
.g-btn{flex:1 1 0;min-width:0;border:2px solid #cfe3f8;background:#fff;color:#2a5b96;
  border-radius:12px;padding:7px 0;font-family:inherit;font-weight:900;font-size:clamp(12px,3.4vw,15px);
  cursor:pointer;line-height:1;box-shadow:0 3px 0 #dbe9f8;transition:background .15s,box-shadow .07s,transform .07s;}
.g-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dbe9f8;}
.g-btn.on{background:linear-gradient(135deg,#4facfe,#2f7ff0);color:#fff;border-color:#2f7ff0;
  box-shadow:0 3px 0 #1f5cb3,0 0 12px rgba(79,172,254,.5);}

/* ---------- 주인공 이름 · 수학 답 방식 (title) ---------- */
.name-row{display:flex;align-items:center;gap:6px;width:100%;}
.name-in{flex:1 1 auto;min-width:0;border:2px solid #cfe3f8;border-radius:12px;padding:7px 10px;
  font-family:inherit;font-weight:900;font-size:16px;line-height:1.15;color:#17395c;background:#fff;
  box-shadow:0 3px 0 #dbe9f8;outline:none;-webkit-user-select:text;user-select:text;
  -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;}
.name-in::placeholder{color:#a9bcd0;font-weight:800;letter-spacing:-.3px;}
.name-in:focus{border-color:#7bb7ff;box-shadow:0 3px 0 #cfe4fb,0 0 0 3px rgba(123,183,255,.28);}
.opt-row{display:flex;align-items:center;gap:4px;width:100%;}
.mt-btn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;
  border:2px solid #cfe3f8;background:#fff;color:#2a5b96;border-radius:12px;padding:7px 0;
  font-family:inherit;font-weight:900;font-size:clamp(12px,3.4vw,15px);line-height:1;cursor:pointer;
  box-shadow:0 3px 0 #dbe9f8;transition:background .15s,box-shadow .07s,transform .07s;}
.mt-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dbe9f8;}
.mt-btn.on{background:linear-gradient(135deg,#4facfe,#2f7ff0);color:#fff;border-color:#2f7ff0;
  box-shadow:0 3px 0 #1f5cb3,0 0 12px rgba(79,172,254,.5);}

/* ---------- 몬스터 속도 (느림 / 보통 / 빠름) ---------- */
.spd-row{display:flex;align-items:center;gap:4px;width:100%;}
.spd-btn{flex:1 1 0;min-width:0;border:2px solid #cfe3f8;background:#fff;color:#2a5b96;
  border-radius:12px;padding:7px 0;font-family:inherit;font-weight:900;font-size:clamp(12px,3.4vw,15px);
  line-height:1;cursor:pointer;box-shadow:0 3px 0 #dbe9f8;
  transition:background .15s,box-shadow .07s,transform .07s,color .15s;}
.spd-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dbe9f8;}
.spd-btn.on{color:#fff;border-color:#2f7ff0;background:linear-gradient(135deg,#4facfe,#2f7ff0);
  box-shadow:0 3px 0 #1f5cb3,0 0 12px rgba(79,172,254,.5);}
.spd-btn[data-speed="slow"].on{border-color:#2f9c3f;background:linear-gradient(135deg,#79d95a,#2f9c3f);
  box-shadow:0 3px 0 #1f7a2c,0 0 12px rgba(80,200,110,.45);}
.spd-btn[data-speed="fast"].on{border-color:#e2620f;background:linear-gradient(135deg,#ffb545,#f4711f);
  box-shadow:0 3px 0 #b34a0c,0 0 12px rgba(255,140,60,.45);}

/* ---------- hud ---------- */
#screenGame{align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#d9f1ff 0%,#eaf8ff 50%,#f4ffef 100%);}
.game-col{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;
  background:#eaf6ff;overflow:hidden;box-shadow:0 0 0 1px rgba(40,90,150,.06),0 10px 44px rgba(30,80,140,.16);}
.hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:5px;
  padding:calc(4px + env(safe-area-inset-top)) 8px 4px;
  background:linear-gradient(#fff,#f1f8ff);border-bottom:2px solid #cfe3f8;}
.hud-hearts{flex:0 0 auto;font-size:clamp(11px,3.5vw,18px);line-height:1;white-space:nowrap;letter-spacing:-1px;}
.hud-mid{flex:1 1 auto;min-width:0;display:flex;gap:3px;align-items:center;justify-content:center;overflow:hidden;}
.pill{background:#eaf3ff;color:#2a5b96;border-radius:99px;padding:3px 7px;font-size:clamp(10px,2.9vw,13px);
  font-weight:900;white-space:nowrap;border:1.5px solid #cfe3f8;line-height:1.2;}
.pill.score{background:#fff4d6;color:#a36700;border-color:#ffe1a4;}
.pill.combo{background:#ffe9e9;color:#d63b3b;border-color:#ffcaca;}
.hud-right{flex:0 0 auto;display:flex;gap:4px;}
@media (max-width:370px){ .pill{padding:2px 5px;font-size:10px;} .hud-hearts{font-size:11px;} }
.icon-btn{width:clamp(27px,8vw,36px);height:clamp(27px,8vw,36px);border-radius:50%;border:2px solid #cfe3f8;background:#fff;
  font-size:clamp(12px,3.6vw,16px);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
  font-family:inherit;padding:0;}
.icon-btn:active{transform:scale(.94);}

/* HUD 안의 속도 버튼 (게임 중 바로 바꾸기) */
.spd-hud{height:clamp(27px,8vw,36px);border-radius:99px;border:2px solid #cfe3f8;background:#f4faff;
  display:flex;align-items:center;justify-content:center;gap:2px;padding:0 6px;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:clamp(10px,2.9vw,13px);line-height:1;color:#2a5b96;
  white-space:nowrap;box-shadow:0 2px 0 #e2eefb;transition:background .15s,border-color .15s,color .15s,transform .07s;}
.spd-hud:active{transform:scale(.93);box-shadow:none;}
.spd-hud[data-speed="slow"]{border-color:#b7e6c0;background:#f1fff4;color:#237c2c;box-shadow:0 2px 0 #dcf3e2;}
.spd-hud[data-speed="fast"]{border-color:#ffcf9e;background:#fff6ec;color:#b34a0c;box-shadow:0 2px 0 #ffe6cf;}
.spd-hud .sh-ico{font-size:clamp(12px,3.6vw,16px);line-height:1;}
.spd-toast{position:absolute;left:50%;top:56px;z-index:26;transform:translate(-50%,-6px);
  background:rgba(18,50,78,.92);color:#fff;font-weight:900;font-size:clamp(11px,3.2vw,14px);
  padding:6px 13px;border-radius:99px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s;box-shadow:0 6px 16px rgba(10,40,80,.28);}
.spd-toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- field ---------- */
.field{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:linear-gradient(#bfe9ff 0%,#dcf4ff 45%,#eefcf0 100%);}
.cloud{position:absolute;font-size:clamp(17px,5.6vw,28px);opacity:.85;pointer-events:none;animation:drift linear infinite;}
.ground{position:absolute;left:0;right:0;bottom:0;height:13%;background:linear-gradient(#a8e063,#57bb2a);}
.fence{position:absolute;left:0;right:0;bottom:13%;height:7px;
  background:repeating-linear-gradient(90deg,#ffe08a 0 12px,#f7b731 12px 24px);
  box-shadow:0 0 10px #ffd15c;opacity:.95;}
/* ---------- hero launcher (bottom) : 얼굴만 덩그러니 + 장갑 손에 든 미사일 ---------- */
.hero{position:absolute;left:50%;bottom:2.2%;width:clamp(104px,27vw,140px);height:clamp(84px,22.6vw,112px);
  transform:translateX(-50%);transform-origin:50% 92%;pointer-events:none;z-index:4;
  animation:heroBob 1.9s ease-in-out infinite;}
.hero-shadow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
  width:clamp(46px,12.5vw,60px);height:clamp(7px,2vw,10px);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(16,62,24,.34) 0%,rgba(16,62,24,.14) 55%,rgba(16,62,24,0) 76%);
  animation:heroShadow 1.9s ease-in-out infinite;}
.hero-head{position:absolute;left:50%;bottom:0;transform:translateX(-50%) rotate(-4deg);
  width:clamp(52px,14.4vw,68px);height:clamp(62px,17.4vw,82px);
  border-radius:46% 46% 50% 50%;overflow:hidden;
  background:radial-gradient(circle at 50% 32%,#ffffff 0%,#e6f3ff 66%,#cfe7fb 100%);
  background-position:50% 40%;background-size:cover;background-repeat:no-repeat;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
  animation:heroSway 2.8s ease-in-out infinite;}
.hero-head.nophoto{background:none;overflow:visible;border-radius:0;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(42px,12vw,60px);line-height:1;}
.hero.firing .hero-head{animation:heroSquash .46s cubic-bezier(.2,.9,.3,1.25);}
.hero-hand{position:absolute;right:1px;bottom:0;z-index:5;
  width:clamp(34px,9.4vw,43px);height:clamp(58px,16vw,74px);
  transform:rotate(9deg);transform-origin:50% 90%;
  filter:drop-shadow(0 2px 4px rgba(10,40,80,.3));
  animation:heroHandIdle 1.6s ease-in-out infinite;}
.hero-hand svg{display:block;width:100%;height:100%;overflow:visible;}
.hero-hand .m-flame{transform-box:fill-box;transform-origin:50% 6%;animation:flameFlick .13s ease-in-out infinite alternate;}
.hero-hand.reloading .m-missile{animation:missileGone .46s cubic-bezier(.25,.9,.3,1.2);}
.hero.firing .hero-hand{animation:heroHandKick .44s cubic-bezier(.2,.9,.3,1.3);}
.hero-pop{position:absolute;left:50%;top:-12px;transform:translateX(-50%) rotate(-9deg);opacity:0;
  font-size:clamp(12px,3.7vw,17px);font-weight:900;color:#ff4d5e;letter-spacing:-.5px;white-space:nowrap;
  -webkit-text-stroke:3px #ffffff;paint-order:stroke fill;
  text-shadow:0 3px 6px rgba(20,50,80,.28);pointer-events:none;}
.hero.firing .hero-pop{animation:heroPop .5s ease-out;}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;}

.monster{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  cursor:pointer;animation:spawnIn .28s ease-out;}
.monster .bubble{background:#fff;border:2px solid #7bb7ff;border-radius:12px;padding:1px 7px;
  font-weight:900;font-size:clamp(11px,3.2vw,17px);white-space:nowrap;color:#17395c;
  box-shadow:0 2px 0 #cfe3ff;margin-bottom:1px;line-height:1.35;}
.monster .body{font-size:clamp(21px,6.6vw,36px);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));
  animation:bob 1.3s ease-in-out infinite;}
.monster.target .bubble{border-color:#ff8a3d;background:#fff7ec;box-shadow:0 2px 0 #ffd6b0,0 0 14px rgba(255,150,60,.55);}
.monster.target .body{filter:drop-shadow(0 0 10px #ffd400) drop-shadow(0 0 4px #ffb300);}
.monster.target::after{content:'🎯';position:absolute;right:-8px;top:-6px;font-size:clamp(11px,3.4vw,17px);
  animation:pulse .75s ease-in-out infinite;}
.monster.hit .body{animation:hitFlash .16s linear 2;}
.monster.die{pointer-events:none;animation:diePop .32s ease-out forwards;}
.monster.gone{pointer-events:none;animation:fadeOut .3s ease-out forwards;}
.monster.boss .body{font-size:clamp(38px,12.5vw,68px);}
.monster.boss .bubble{font-size:clamp(12px,3.6vw,19px);border-color:#ff6b6b;box-shadow:0 2px 0 #ffc7c7,0 0 16px rgba(255,90,90,.45);}
.monster.boss.target .bubble{border-color:#ff8a3d;}
.hpwrap{width:clamp(66px,24vw,132px);margin-top:4px;}
.hpbar{height:10px;border-radius:99px;background:#ffdcdc;border:2px solid #f0a0a0;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.18);}
.hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff5b5b,#ffb03a);transition:width .18s ease;}
.bossname{text-align:center;font-size:clamp(9px,2.8vw,12px);font-weight:900;color:#b3261e;margin-bottom:2px;white-space:nowrap;}

.p{position:absolute;transform:translate(-50%,-50%);pointer-events:none;line-height:1;}
.flt{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#ff6a00;white-space:nowrap;
  text-shadow:0 2px 0 #fff,0 0 8px rgba(255,255,255,.9);font-size:clamp(13px,4.2vw,20px);pointer-events:none;}
.flt.big{color:#e0341f;font-size:clamp(15px,5vw,24px);}
.muzzle{position:absolute;transform:translate(-50%,-50%);font-size:clamp(14px,4.4vw,22px);pointer-events:none;}

/* ---------- missile & impact fx ---------- */
.missile{position:absolute;width:clamp(13px,3.8vw,18px);height:clamp(13px,3.8vw,18px);border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;will-change:left,top;
  background:radial-gradient(circle at 50% 50%,#fff 0%,#fff5b0 25%,#ffbe2e 55%,rgba(255,90,0,0) 78%);
  box-shadow:0 0 12px 4px rgba(255,196,80,.9),0 0 30px 12px rgba(255,110,0,.45);}
.missile::after{content:'';position:absolute;inset:-48%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,190,.55),rgba(255,160,40,0) 70%);
  animation:corePulse .16s ease-in-out infinite alternate;}
.streak{position:absolute;height:clamp(5px,1.8vw,8px);border-radius:99px;pointer-events:none;will-change:left,top,transform;
  transform:translate(-50%,-50%);transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(255,60,0,0),#ff7a12 38%,#ffc93c 72%,#fffbe6 100%);
  filter:blur(.6px);box-shadow:0 0 12px rgba(255,150,40,.85);}
.mtrail{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;}
.shock{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform;
  border:3px solid #fff;box-shadow:0 0 16px #ffd34d,0 0 32px rgba(255,120,20,.85);}
.flashw{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.9) 30%,rgba(255,236,150,.45) 56%,rgba(255,180,60,0) 74%);}
.monster.impact .body{animation:impactBody .3s cubic-bezier(.2,.85,.3,1);}
.monster.pending .bubble{opacity:.5;border-color:#9cc7f0;box-shadow:0 2px 0 #dbe9f8;}
.monster.pending::after{content:'💫';position:absolute;right:-8px;top:-6px;font-size:clamp(10px,3vw,15px);
  animation:pulse .6s ease-in-out infinite;}

.banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:5px;
  pointer-events:none;opacity:0;z-index:20;}
.banner.show{animation:bannerPop 1.9s ease-out forwards;}
.banner .b1{font-size:clamp(20px,6.8vw,38px);font-weight:900;color:#fff;padding:8px 18px;border-radius:16px;
  background:linear-gradient(135deg,#ff5f6d,#ff9966);
  box-shadow:0 6px 0 rgba(180,30,30,.32),0 0 30px rgba(255,120,80,.55);text-shadow:0 2px 0 rgba(0,0,0,.14);}
.banner .b2{font-size:clamp(12px,3.8vw,17px);font-weight:900;color:#123;background:#fff;padding:3px 12px;border-radius:99px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);}

/* ---------- panel ---------- */
.panel{flex:0 0 auto;background:linear-gradient(#ffffff,#f7fbff);border-top:3px solid #cfe3f8;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.panel-idle{text-align:center;font-weight:900;color:#8aa4bf;font-size:clamp(13px,3.9vw,17px);padding:clamp(14px,4vh,28px) 0;}
.qbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px;}
.q{flex:0 1 auto;text-align:center;font-weight:900;color:#12324e;letter-spacing:1px;white-space:nowrap;
  font-size:clamp(21px,6.8vw,34px);}
.ans{flex:0 0 auto;min-width:clamp(50px,16vw,86px);height:clamp(36px,5.6vh,52px);border-radius:12px;
  background:#eaf3ff;border:2px dashed #8fbdf0;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:#1a4b8c;font-size:clamp(19px,6vw,31px);padding:0 6px;}
.ans.typed{background:#fff6e2;border-color:#ffc266;border-style:solid;color:#a85f00;}
.ans.bad{animation:shake .34s ease;background:#ffe6e6;border-color:#ff9b9b;color:#c62b2b;}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.pad .k{height:clamp(31px,7.1vh,54px);border:0;border-radius:12px;background:linear-gradient(#ffffff,#eef5ff);
  box-shadow:0 3px 0 #c9dcf5;font-family:inherit;font-weight:900;color:#17395c;cursor:pointer;
  font-size:clamp(17px,5.2vw,25px);padding:0;}
.pad .k:active{transform:translateY(3px);box-shadow:0 0 0 #c9dcf5;}
.pad .k.del{background:linear-gradient(#fff,#ffeef0);box-shadow:0 3px 0 #f6c9cf;color:#b9434f;font-size:clamp(14px,4.2vw,20px);}
.pad .k.fire{background:linear-gradient(#ffd166,#ff9f1c);box-shadow:0 3px 0 #d98200;color:#5a2c00;
  font-size:clamp(13px,4vw,19px);letter-spacing:-.5px;}
.pad .k.fire:active{box-shadow:0 0 0 #d98200;}

.whead{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;min-height:clamp(30px,5.4vh,46px);}
.wemoji{font-size:clamp(24px,7.4vw,38px);line-height:1;}
.wqwrap{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;}
.wq{font-weight:900;color:#12324e;letter-spacing:2px;font-size:clamp(23px,7.6vw,38px);line-height:1.1;white-space:nowrap;}
.whint{font-weight:800;color:#6f8aa6;font-size:clamp(10px,3.1vw,13px);margin-top:1px;}
.blank{color:#e8532f;background:#fff0e6;border-radius:6px;padding:0 3px;margin:0 1px;
  border-bottom:3px solid #ffb27a;display:inline-block;line-height:1.05;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.ch{position:relative;height:clamp(42px,8.4vh,64px);border:0;border-radius:14px;background:linear-gradient(#ffffff,#eef5ff);
  box-shadow:0 3px 0 #c9dcf5;font-family:inherit;font-weight:900;color:#17395c;cursor:pointer;
  font-size:clamp(15px,4.8vw,25px);padding:0 6px;}
.ch:active{transform:translateY(3px);box-shadow:0 0 0 #c9dcf5;}
.ch i{position:absolute;left:7px;top:5px;font-style:normal;font-weight:800;color:#93aec9;font-size:clamp(9px,2.7vw,12px);}
.ch.bad{animation:shake .34s ease;background:#ffe9e9;box-shadow:0 3px 0 #f3b6b6;color:#c62b2b;}
/* 객관식 수학 — 낱말 모드와 같은 4지선다, 숫자를 크게 */
.qbar.qbar-choice{min-height:clamp(30px,5.4vh,46px);margin-bottom:4px;}
.ch.mch{font-size:clamp(18px,5.6vw,30px);letter-spacing:-.5px;}

/* ---------- overlay ---------- */
.overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(10,25,45,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.conflayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
.ov-card{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:18px 16px 16px;text-align:center;
  box-shadow:0 18px 44px rgba(10,40,80,.35);animation:popIn .28s ease-out;position:relative;overflow:hidden;z-index:2;}
.ov-emoji{font-size:clamp(36px,11vw,58px);line-height:1;}
.ov-title{margin:6px 0 0;font-size:clamp(17px,5.4vw,25px);font-weight:900;color:#12324e;}
.ov-sub{margin:6px 0 0;font-size:clamp(11px,3.4vw,14px);font-weight:800;color:#7288a3;line-height:1.5;}
.ov-stats{display:flex;justify-content:center;gap:8px;margin:12px 0 14px;}
.ov-stat{background:#f2f8ff;border-radius:14px;padding:7px 14px;font-size:clamp(10px,3vw,12px);font-weight:800;color:#5a7595;}
.ov-stat b{display:block;font-size:clamp(17px,5.2vw,24px);color:#1d4e89;margin-top:2px;}
.ov-stat.new b{color:#e8532f;}
.ov-btns{display:flex;flex-direction:column;gap:8px;}
.ov-btn{border:0;border-radius:16px;padding:12px;font-family:inherit;font-weight:900;color:#fff;cursor:pointer;
  font-size:clamp(14px,4.2vw,18px);background:linear-gradient(135deg,#4facfe,#2f7ff0);box-shadow:0 4px 0 #1f5cb3;}
.ov-btn.ghost{background:#f0f6ff;color:#3a6ca8;box-shadow:0 4px 0 #d3e4f8;}
.ov-btn:active{transform:translateY(3px);box-shadow:none;}
.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:confFall linear forwards;}

/* ---------- animations ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.24);opacity:.75}}
@keyframes spawnIn{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes diePop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}
  14%{transform:translate(-50%,-66%) scale(1.28,.78) rotate(-4deg);opacity:1}
  45%{transform:translate(-50%,-62%) scale(1.5,.86) rotate(12deg);opacity:1}
  100%{transform:translate(-50%,-135%) scale(.15) rotate(-32deg);opacity:0}}
@keyframes fadeOut{to{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes hitFlash{0%,100%{filter:none}50%{filter:brightness(3) saturate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bannerPop{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.06)}
  28%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
@keyframes popIn{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:none}}
@keyframes confFall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(115vh) rotate(720deg)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}
  10%{transform:translate(var(--skx,-6px),calc(var(--sky,3px) * -1))}
  30%{transform:translate(calc(var(--skx,-6px) * -.88),var(--sky,3px))}
  50%{transform:translate(calc(var(--skx,-6px) * .62),calc(var(--sky,3px) * -.72))}
  70%{transform:translate(calc(var(--skx,-6px) * -.44),calc(var(--sky,3px) * .5))}
  88%{transform:translate(calc(var(--skx,-6px) * .24),calc(var(--sky,3px) * -.26))}}
.shaking{animation:screenShake var(--skd,.3s) ease-out;}
@keyframes corePulse{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.14)}}
/* ---------- hero launcher animations ---------- */
@keyframes heroBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes heroShadow{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(.86);opacity:.58}}
@keyframes heroSway{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(3deg)}}
@keyframes heroSquash{
  0%{transform:translateX(-50%) rotate(-5deg) scale(1,1)}
  16%{transform:translateX(-50%) translate(-2px,4px) rotate(-13deg) scale(1.2,.78)}
  38%{transform:translateX(-50%) translate(1px,-6px) rotate(8deg) scale(.88,1.16)}
  60%{transform:translateX(-50%) translate(-1px,2px) rotate(-8deg) scale(1.07,.95)}
  80%{transform:translateX(-50%) rotate(2deg) scale(.98,1.02)}
  100%{transform:translateX(-50%) rotate(-5deg) scale(1,1)}}
@keyframes heroHandIdle{0%,100%{transform:rotate(9deg) translateY(0)}50%{transform:rotate(4deg) translateY(-2px)}}
@keyframes heroHandKick{
  0%{transform:rotate(9deg) translateY(0)}
  18%{transform:rotate(-7deg) translate(-3px,3px)}
  44%{transform:rotate(16deg) translate(2px,-2px)}
  70%{transform:rotate(5deg) translate(0,1px)}
  100%{transform:rotate(9deg) translateY(0)}}
@keyframes missileGone{
  0%{opacity:1;transform:translateY(0) scale(1)}
  18%{opacity:1;transform:translateY(-16%) scale(.84)}
  40%{opacity:0;transform:translateY(-58%) scale(.3)}
  58%{opacity:0;transform:translateY(-10%) scale(.2)}
  70%{opacity:1;transform:translateY(-6%) scale(1.26)}
  86%{opacity:1;transform:translateY(0) scale(.93)}
  100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heroPop{
  0%{opacity:0;transform:translateX(-50%) translateY(6px) rotate(-16deg) scale(.3)}
  28%{opacity:1;transform:translateX(-50%) translateY(-4px) rotate(-8deg) scale(1.18)}
  62%{opacity:1;transform:translateX(-50%) translateY(-8px) rotate(-6deg) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-20px) rotate(-3deg) scale(.9)}}
@keyframes flameFlick{from{transform:scale(.86,1.12);opacity:.78}to{transform:scale(1.14,.9);opacity:1}}
@keyframes impactBody{
  0%{transform:scale(1,1);filter:none}
  16%{transform:scale(1.5,.55) translateY(14%);filter:brightness(3.2) saturate(0)}
  42%{transform:scale(.76,1.34) translateY(-12%);filter:brightness(2.1) saturate(.5)}
  66%{transform:scale(1.14,.9) translateY(-3%)}
  100%{transform:scale(1,1);filter:none}}
</style>
</head>
<body>
<div id="app">

  <!-- ================= TITLE ================= -->
  <section id="screenTitle" class="screen">
    <span class="deco" style="left:8%;top:9%;animation-delay:0s">👾</span>
    <span class="deco" style="right:9%;top:14%;animation-delay:.8s">⭐</span>
    <span class="deco" style="left:14%;bottom:12%;animation-delay:1.4s">🎈</span>
    <span class="deco" style="right:12%;bottom:16%;animation-delay:.4s">🍭</span>
    <div class="title-wrap">
      <div class="logo">👾 수학·낱말 디펜스
        <span class="sub">몬스터가 오기 전에 문제를 풀어 물리쳐라!</span>
      </div>

      <div class="grade-row" id="gradeRow" role="group" aria-label="수학 학년 선택">
        <span class="grade-cap">학년</span>
        <button class="g-btn" type="button" data-grade="0">5세</button>
        <button class="g-btn on" type="button" data-grade="1">초1</button>
        <button class="g-btn" type="button" data-grade="2">초2</button>
        <button class="g-btn" type="button" data-grade="3">초3</button>
        <button class="g-btn" type="button" data-grade="4">초4</button>
        <button class="g-btn" type="button" data-grade="5">초5</button>
        <button class="g-btn" type="button" data-grade="6">초6</button>
      </div>

      <div class="name-row">
        <span class="grade-cap" aria-hidden="true">🏷️ 이름</span>
        <input class="name-in" id="heroName" type="text" maxlength="10" placeholder="예: 민준"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="done" aria-label="주인공 이름 (최대 10자)">
      </div>

      <div class="opt-row" id="mathTypeRow" role="group" aria-label="수학 답 입력 방식">
        <span class="grade-cap">답</span>
        <button class="mt-btn on" data-mt="typein" type="button">✏️ 주관식</button>
        <button class="mt-btn" data-mt="choice" type="button">🔢 객관식</button>
      </div>

      <div class="spd-row" id="speedRow" role="group" aria-label="몬스터 속도 선택">
        <span class="grade-cap">속도</span>
        <button class="spd-btn" data-speed="slow" type="button">🐢 느림</button>
        <button class="spd-btn on" data-speed="normal" type="button">🏃 보통</button>
        <button class="spd-btn" data-speed="fast" type="button">⚡ 빠름</button>
      </div>

      <button class="mode-card m-math" data-mode="math" type="button">
        <span class="mc-emoji">🔢</span>
        <span class="mc-txt">수학 대모험
          <span class="mc-sub" id="subMath">한 자리 덧셈·뺄셈</span>
        </span>
        <span class="mc-best" data-best="math">최고 0점</span>
      </button>

      <button class="mode-card m-word" data-mode="word" type="button">
        <span class="mc-emoji">🔤</span>
        <span class="mc-txt">한글 낱말 탐험
          <span class="mc-sub">그림 · 빈칸 낱말 3단계</span>
        </span>
        <span class="mc-best" data-best="word">최고 0점</span>
      </button>

      <button class="mode-card m-mix" data-mode="mix" type="button">
        <span class="mc-emoji">⚡</span>
        <span class="mc-txt">무한 혼합
          <span class="mc-sub" id="subMix">수학 + 낱말, 끝없이 도전</span>
        </span>
        <span class="mc-best" data-best="mix">최고 0점</span>
      </button>

      <div class="hero-set">
        <input class="hero-file" id="heroPhotoInput" type="file" accept="image/*" aria-label="주인공 사진 고르기">
        <button class="hp-btn" id="btnHeroPhoto" type="button" aria-label="주인공 사진 넣기">
          <span class="hp-ico" aria-hidden="true">📸</span>
          <span class="hp-thumb" id="heroPhotoThumb" aria-hidden="true"></span>
          <span class="hp-lb" id="heroPhotoLabel">주인공 사진 넣기</span>
        </button>
        <button class="hp-reset" id="btnHeroReset" type="button" hidden>초기화</button>
      </div>

      <div class="title-foot">
        <span class="best-all">🏆 최고 점수 <b id="bestAll">0</b></span>
        <button class="icon-btn" id="btnSoundTitle" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </div>
    <div class="title-toast" id="heroToast" role="status" aria-live="polite"></div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screenGame" class="screen" hidden>
   <div class="game-col">
    <div class="hud">
      <div class="hud-hearts" id="heartsEl">❤️❤️❤️❤️❤️</div>
      <div class="hud-mid">
        <span class="pill" id="stageLabel">1단계</span>
        <span class="pill score" id="scoreLabel">0점</span>
        <span class="pill combo" id="comboLabel" hidden>🔥 x2</span>
      </div>
      <div class="hud-right">
        <button class="spd-hud" id="btnSpeed" data-speed="normal" type="button" aria-label="몬스터 속도 바꾸기 (지금: 보통)">
          <span class="sh-ico" id="spdHudIco" aria-hidden="true">🏃</span><span id="spdHudLb">보통</span>
        </button>
        <button class="icon-btn" id="btnSound" type="button" aria-label="소리">🔊</button>
        <button class="icon-btn" id="btnPause" type="button" aria-label="일시정지">⏸</button>
      </div>
    </div>

    <div class="field" id="field">
      <span class="cloud" style="top:8%;animation-duration:26s;animation-delay:-4s">☁️</span>
      <span class="cloud" style="top:26%;animation-duration:34s;animation-delay:-16s">☁️</span>
      <span class="cloud" style="top:44%;animation-duration:30s;animation-delay:-24s">🕊️</span>
      <div class="ground"></div>
      <div class="fence"></div>
      <div class="hero" id="heroEl">
        <div class="hero-shadow" aria-hidden="true"></div>
        <div class="hero-head nophoto" id="heroFace">🚀</div>
        <span class="hero-pop" aria-hidden="true">푱!</span>
        <div class="hero-hand" id="heldMissile" aria-hidden="true">
          <svg viewBox="0 0 44 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="mgBody" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#dbe9f7"/><stop offset=".32" stop-color="#ffffff"/>
                <stop offset=".74" stop-color="#f4faff"/><stop offset="1" stop-color="#c6dcf1"/>

}

  var px = maxPx;

    var w = 0;
    for(var i=0;i<lines.length;i++){
      var lw = measureText(lines[i], px) + lines[i].length * 1.1; // letter-spacing 여유
      if(lw > w) w = lw;
    }
    if(w <= maxW || px <= minPx) break;
    px -= 1;
  }
  return px;
}

var Sfx = (function(){
  var ctx = null;

  function ensure(){
    if(!ctx){
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) ctx = new AC();
      }catch(e){ ctx = null; }
    }
    if(ctx && ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }

  function tone(o){
    if(muted) return;
    var c = ensure();
    if(!c) return;
    try{
      var t0 = c.currentTime + (o.delay || 0);
      var dur = o.dur || 0.12;
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t0);
      if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + dur);
      var vol = (o.vol == null) ? 0.14 : o.vol;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }catch(e){}
  }

  function noise(o){
    if(muted) return;
    var c = ensure();
    if(!c) return;
    try{
      var dur = o.dur || 0.16;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for(var i=0;i<len;i++){
        var env = 1 - (i / len);
        data[i] = (Math.random()*2 - 1) * env * env;
      }
      var src = c.createBufferSource();
      src.buffer = buf;
      var filt = c.createBiquadFilter();
      filt.type = o.filter || 'lowpass';
      filt.frequency.setValueAtTime(o.freq || 1400, c.currentTime);
      if(o.to) filt.frequency.exponentialRampToValueAtTime(Math.max(60, o.to), c.currentTime + dur);
      var q = c.createGain();
      var t0 = c.currentTime + (o.delay || 0);
      q.gain.setValueAtTime(0.0001, t0);
      q.gain.exponentialRampToValueAtTime(o.vol == null ? 0.09 : o.vol, t0 + 0.008);
      q.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filt); filt.connect(q); q.connect(c.destination);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    }catch(e){}
  }

    unlock: function(){ ensure(); },
    muted: function(){ return muted; },
    toggle: function(){ muted = !muted; Store.set('gm_muted', muted); return muted; },

    hit: function(){ tone({freq:340, to:90, dur:0.17, type:'sawtooth', vol:0.09}); },
    /* 발사: 숨을 모아 폭발시키는 듯한 퓨- 슈욱 */
    launch: function(){

      tone({freq:1650, to:520, dur:0.10, type:'sawtooth', vol:0.03, delay:0.02});
      noise({dur:0.17, freq:2400, to:600, filter:'bandpass', vol:0.05});

    /* 명중: 저음을 찍어 누르는 펑 + 펑크나는 팝 */
    impact: function(power){
      var p = power || 1;
      tone({freq:175, to:44, dur:0.26, type:'sine', vol:0.17 * p});
      tone({freq:88, to:34, dur:0.32, type:'triangle', vol:0.10 * p});
      noise({dur:0.17, freq:2000, to:220, filter:'lowpass', vol:0.10 * p});

    bossHit: function(){ tone({freq:190, to:70, dur:0.22, type:'square', vol:0.1}); },
    bossAppear: function(){
      tone({freq:196, dur:0.26, type:'square', vol:0.09, delay:0});

/* =========================================================
   problem generators
   ========================================================= */
function genMath(grade, stage){
  var g = normGrade(grade);
  var s = clamp(stage || 1, 1, 3);
  var p;
  if(g === 0) p = genG0(s);
  else if(g === 1) p = genG1(s);
  else if(g === 2) p = genG2(s);
  else if(g === 3) p = genG3(s);
  else if(g === 4) p = genG4(s);
  else if(g === 5) p = genG5(s);
  else p = genG6(s);
  p.grade = g;
  return p;
}

/* 문제 문자열은 말풍선에 꼭 맞도록 짧게 유지한다 (긴 문제는 두 줄) */
function mkMath(text, ans, lines){
  return { type:'math', text:text, ans:ans, lines: lines || [text] };
}
function qMul(a,b){ return mkMath(a + ' × ' + b + ' = ?', a*b); }
function qDiv(a,b){ return mkMath(a + ' ÷ ' + b + ' = ?', a/b); }
function qAdd(a,b){ return mkMath(a + ' + ' + b + ' = ?', a+b); }
function qSub(a,b){ return mkMath(a + ' - ' + b + ' = ?', a-b); }

/* 5세 — 한 자리 수 덧셈만 (뺄셈·곱셈 없음) */
function genG0(s){
  var a, b;
  if(s === 1){ a = ri(1,4); b = ri(1,4); }        // 합 2~8, 손가락으로 셀 수 있는 수
  else if(s === 2){ a = ri(1,5); b = ri(1,5); }   // 합 2~10
  else { a = ri(1,9); b = ri(1,9); }              // 합 2~18, 모든 한 자리 덧셈
  return qAdd(a,b);
}

/* 초1 — 한 자리·두 자리 덧셈·뺄셈 */
function genG1(s){
  var a, b, op;
  if(s === 1){
    if(Math.random() < 0.5){ a = ri(1,9); b = ri(1,10-a); op = '+'; }
    else { a = ri(2,10); b = ri(1,a-1); op = '-'; }
  } else if(s === 2){
    if(Math.random() < 0.55){
      if(Math.random() < 0.6){ a = ri(2,9); b = ri(2,9); }
      else { a = ri(10,15); b = ri(1,5); }
      op = '+';
    } else {
      if(Math.random() < 0.6){ a = ri(11,19); b = ri(1,9); }
      else { a = ri(5,15); b = ri(1,5); }
      if(b >= a) b = a - 1;
      op = '-';
    }
  } else {
    if(Math.random() < 0.5){
      if(Math.random() < 0.5){ a = ri(5,9); b = ri(5,9); }
      else { a = ri(10,19); b = ri(1, 20-a); }
      op = '+';
    } else {
      if(Math.random() < 0.5){ a = ri(11,20); b = ri(5,9); }
      else { a = ri(11,20); b = ri(2,8); }
      if(b >= a) b = a - 1;
      op = '-';
    }
  }
  return (op === '+') ? qAdd(a,b) : qSub(a,b);
}

/* 초2 — 곱셈 구구, 두 자리 받아올림·내림 */
function genG2(s){
  var r = Math.random();

  function noCarryAdd(){
    var u1 = ri(0,8), u2 = ri(0,9-u1);
    return qAdd(10*ri(1,4) + u1, 10*ri(1,4) + u2);
  }
  function noBorrowSub(){
    var u2 = ri(0,9), u1 = ri(u2,9), t1 = ri(3,9), t2 = ri(1,t1-1);
    return qSub(10*t1 + u1, 10*t2 + u2);
  }
  function carryAdd(){
    var u1 = ri(2,9), u2 = ri(10-u1,9);
    return qAdd(10*ri(1,4) + u1, 10*ri(1,4) + u2);
  }
  function borrowSub(){
    var u1 = ri(1,8), u2 = ri(u1+1,9), t1 = ri(3,9), t2 = ri(1,t1-1);
    return qSub(10*t1 + u1, 10*t2 + u2);
  }

  if(s === 1){
    if(r < 0.50) return qMul(ri(2,9), ri(2,9));
    if(r < 0.78) return noCarryAdd();
    return noBorrowSub();
  }
  if(s === 2){
    if(r < 0.45) return qMul(ri(2,9), ri(2,9));
    if(r < 0.75) return carryAdd();
    return borrowSub();
  }
  if(r < 0.40) return qMul(ri(2,9), ri(2,9));
  if(r < 0.70) return carryAdd();
  return borrowSub();
}

/* 초3 — 두 자리 × 한 자리, 나눗셈, 세 자리 덧셈·뺄셈 */
function genG3(s){
  var r = Math.random(), b, q;
  if(s === 1){
    if(r < 0.38) return qMul(ri(11,49), ri(2,9));
    if(r < 0.66){ b = ri(2,9); q = ri(2,9); return qDiv(b*q, b); }
    return qAdd(ri(120,480), ri(110,410));
  }
  if(s === 2){
    if(r < 0.40) return qMul(ri(12,49), ri(2,9));
    if(r < 0.68){ b = ri(2,9); q = ri(3,9); return qDiv(b*q, b); }
    return qSub(ri(320,860), ri(120,310));
  }
  if(r < 0.34) return qMul(ri(21,49), ri(3,9));
  if(r < 0.64){ b = ri(3,9); q = ri(11,29); return qDiv(b*q, b); }
  if(r < 0.82) return qAdd(ri(230,690), ri(180,300));
  return qSub(ri(420,960), ri(180,390));
}

/* 초4 — 두 자리·세 자리 곱셈, 나눗셈, 혼합 계산 */
function genG4(s){
  var r = Math.random(), b, q, a, c;

  function orderQ(){
    var t = ri(1,4);
    if(t === 1){ a = ri(2,9); b = ri(2,9); c = ri(2,9); return mkMath(a + ' + ' + b + ' × ' + c + ' = ?', a + b*c); }
    if(t === 2){ b = ri(2,9); c = ri(2,9); a = ri(b*c + 1, b*c + 30); return mkMath(a + ' - ' + b + ' × ' + c + ' = ?', a - b*c); }
    if(t === 3){ c = ri(2,9); q = ri(2,9); a = ri(1,40); return mkMath(a + ' + ' + (c*q) + ' ÷ ' + c + ' = ?', a + q); }
    c = ri(2,9); q = ri(2,9); a = ri(q + 1, q + 40);
    return mkMath(a + ' - ' + (c*q) + ' ÷ ' + c + ' = ?', a - q);
  }

  if(s === 1){
    if(r < 0.36) return qMul(ri(12,29), ri(11,19));
    if(r < 0.64) return qMul(ri(112,249), ri(2,9));
    if(r < 0.88){ b = ri(11,19); q = ri(2,9); return qDiv(b*q, b); }
    return orderQ();
  }
  if(s === 2){
    if(r < 0.30) return qMul(ri(13,29), ri(12,29));
    if(r < 0.56) return qMul(ri(125,349), ri(2,9));
    if(r < 0.78){ b = ri(11,24); q = ri(3,9); return qDiv(b*q, b); }
    return orderQ();
  }
  if(r < 0.34) return orderQ();
  if(r < 0.64) return qMul(ri(15,39), ri(11,29));
  if(r < 0.82) return qMul(ri(135,399), ri(3,9));
  b = ri(12,29); q = ri(4,9);
  return qDiv(b*q, b);
}

/* 초5 — 괄호 혼합 계산, 최대공약수·최소공배수, 단위 바꾸기 */
function genG5(s){
  var r = Math.random(), a, b, c, q, n;

  function parenQ(){
    var t = ri(1,4);
    if(t === 1){
      c = ri(2,9); var sum = c * ri(3,15);
      a = ri(Math.max(2, sum - 40), sum - 1); b = sum - a;
      return mkMath('(' + a + ' + ' + b + ') ÷ ' + c + ' = ?', sum / c);
    }
    if(t === 2){ a = ri(2,9); c = ri(1,9); b = ri(c + 1, c + 9); return mkMath(a + ' × (' + b + ' - ' + c + ') = ?', a*(b-c)); }
    if(t === 3){
      c = ri(2,9); q = ri(2,9); var diff = c*q; b = ri(1,20); a = diff + b;
      return mkMath('(' + a + ' - ' + b + ') ÷ ' + c + ' = ?', q);
    }
    a = ri(2,20); b = ri(2,20); c = ri(2,9);
    return mkMath('(' + a + ' + ' + b + ') × ' + c + ' = ?', (a+b)*c);
  }
  function gcdQ(){
    var x, y, g = 1, guard = 0;
    do{ x = ri(4,30); y = ri(4,30); g = gcd(x,y); guard++; }while((x === y || g < 2) && guard < 50);
    return mkMath(x + ',' + y + '의 최대공약수 = ?', g, [x + ',' + y, '최대공약수 = ?']);
  }
  function lcmQ(){
    var x, y, guard = 0;
    do{ x = ri(3,12); y = ri(3,12); guard++; }while((x === y || lcm(x,y) > 200) && guard < 50);
    return mkMath(x + ',' + y + '의 최소공배수 = ?', lcm(x,y), [x + ',' + y, '최소공배수 = ?']);
  }
  function unitQ(){
    var t = ri(1,10);
    if(t <= 3){ n = ri(2,6); return mkMath(n + '시간 = ?분', n*60); }
    if(t <= 5){ n = ri(2,9); return mkMath(n + '분 = ?초', n*60); }
    if(t <= 7){ n = ri(2,9); return mkMath(n + 'm = ?cm', n*100); }
    if(t === 8){ n = ri(2,9); return mkMath((n*1000) + 'm = ?km', n); }
    if(t === 9){ n = ri(2,4); return mkMath(n + 'km = ?m', n*1000); }
    n = ri(2,3); return mkMath(n + 'kg = ?g', n*1000);
  }

  if(s === 1){
    if(r < 0.45) return parenQ();
    if(r < 0.80) return unitQ();
    return gcdQ();
  }
  if(s === 2){
    if(r < 0.30) return parenQ();
    if(r < 0.55) return unitQ();
    if(r < 0.78) return gcdQ();
    return lcmQ();
  }
  if(r < 0.38) return parenQ();
  if(r < 0.58) return unitQ();
  if(r < 0.79) return gcdQ();
  return lcmQ();
}

/* 초6 — 퍼센트, 비율, □가 있는 식, 암산 도전 */
function genG6(s){
  var r = Math.random(), a, b, c, q, x;

  function percentQ(){
    var base = ri(2,20)*10, p = ri(1,9)*10;
    return mkMath(base + '의 ' + p + '% = ?', base*p/100);
  }
  function ratioQ(){
    a = ri(1,7); b = ri(2,9); var k = ri(2,6);
    return mkMath(a + ' : ' + b + ' = ' + (a*k) + ' : ?', b*k);
  }
  function missingQ(){
    var t = ri(1,3);
    if(t === 1){ b = ri(2,9); x = ri(2,12); return mkMath('□ × ' + b + ' = ' + (b*x), x); }
    if(t === 2){ b = ri(11,49); x = ri(20,90); return mkMath('□ - ' + b + ' = ' + x, x + b); }
    b = ri(11,49); x = ri(20,90); return mkMath('□ + ' + b + ' = ' + (x+b), x);
  }
  function mentalQ(){
    a = pick([12,15,16,18,24,25,35,45]); b = pick([11,12,14,15,16,18,20]);
    return mkMath(a + ' × ' + b + ' = ?', a*b);
  }
  function divAddQ(){
    b = ri(11,19); q = ri(2,9); c = ri(5,45);
    return mkMath((b*q) + ' ÷ ' + b + ' + ' + c + ' = ?', q + c);
  }

  if(s === 1){
    if(r < 0.35) return percentQ();
    if(r < 0.65) return missingQ();
    if(r < 0.85) return mentalQ();
    return divAddQ();
  }
  if(s === 2){
    if(r < 0.25) return percentQ();
    if(r < 0.50) return ratioQ();
    if(r < 0.70) return missingQ();
    if(r < 0.85) return mentalQ();
    return divAddQ();
  }
  if(r < 0.20) return percentQ();
  if(r < 0.40) return ratioQ();
  if(r < 0.60) return missingQ();
  if(r < 0.80) return mentalQ();
  return divAddQ();
}

function genWord(stage){
  var s = Math.min(stage, 3);
  var cat = pick(WORD_CATS);
  var item = null, guard = 0;
  do{
    item = pick(cat.items);
    guard++;
  } while(recentWords.indexOf(item[1]) !== -1 && guard < 20);

  recentWords.push(item[1]);
  if(recentWords.length > 8) recentWords.shift();

  var word = item[1], emoji = item[0];
  var useMissing = Math.random() < (s === 1 ? 0.28 : (s === 2 ? 0.45 : 0.55));

  if(useMissing && word.length >= 2){
    var idx = ri(0, word.length - 1);
    var answer = word.charAt(idx);
    var opts = [answer];
    var g2 = 0;
    while(opts.length < 4 && g2 < 300){
      g2++;
      var cand = pick(SYL);
      if(opts.indexOf(cand) === -1) opts.push(cand);
    }
    // prettier distractors: syllables that appear in other words of the same category
    var extra = [];
    for(var i=0;i<cat.items.length && extra.length<6;i++){
      var w = cat.items[i][1];
      for(var j=0;j<w.length;j++){
        var ch = w.charAt(j);
        if(ch !== answer && opts.indexOf(ch) === -1 && extra.indexOf(ch) === -1) extra.push(ch);
      }
    }
    shuffle(extra);
    for(var k=0;k<extra.length && opts.length<4;k++) opts.push(extra[k]);

    var shown = '';
    for(var n=0;n<word.length;n++){
      shown += (n === idx) ? '<b class="blank">?</b>' : word.charAt(n);
    }
    return {
      type: 'word', kind: 'missing', emoji: emoji, answer: answer,
      choices: shuffle(opts.slice(0,4)), full: word,
      qhtml: shown, plain: word.substring(0,idx) + '_' + word.substring(idx+1),
      hint: '빈 칸에 들어갈 글자는?'
    };
  }

  var others = [];
  for(var q=0;q<cat.items.length;q++){
    if(cat.items[q][1] !== word) others.push(cat.items[q][1]);
  }
  shuffle(others);
  var choices = shuffle([word].concat(others.slice(0,3)));

  return {
    type: 'word', kind: 'pic', emoji: emoji, answer: word,
    choices: choices, full: word,
    qhtml: '？？？', plain: emoji,
    hint: '이것의 이름은 무엇일까요?'
  };
}

var SPEED_BOOST = 1.30;   // 몹 하강 속도 (기존 대비 +30%)

/* 속도 난이도 — 🐢 느림 / 🏃 보통 / ⚡ 빠름 (기기 안(localStorage)에만 저장) */
var SPEED_KEY = 'gm_speed_level';
var SPEED_LEVELS = { slow: 0.75, normal: 1.00, fast: 1.35 };
var SPEED_LABELS = { slow: '🐢 느림', normal: '🏃 보통', fast: '⚡ 빠름' };
var speedLevel = 'normal';

function normSpeed(v){
  return (v === 'slow' || v === 'fast') ? v : 'normal';
}

function speedFactor(){
  var v = SPEED_LEVELS[speedLevel];
  return (typeof v === 'number') ? v : 1;
}

function speedLabel(){
  return SPEED_LABELS[speedLevel] || SPEED_LABELS.normal;
}

/* 학년·속도 난이도를 모두 곱한 최종 배율 — 5세는 한 번 더 느리게 */
function speedScale(){
  return SPEED_BOOST * ((S.grade === 0) ? 0.70 : 1) * speedFactor();
}

function stageParams(stage){
  var s = clamp(stage, 1, 5);
  var tbl = {
    1: { spawn: 2.6, speed: 0.056 },
    2: { spawn: 2.3, speed: 0.070 },
    3: { spawn: 2.0, speed: 0.084 },
    4: { spawn: 1.8, speed: 0.094 },
    5: { spawn: 1.6, speed: 0.102 }
  };
  var p = tbl[s];
  var g = normGrade(S.grade);
  // 몹이 내려오는 속도를 조금 더 빠르게 (기존보다 30%)
  // 학년이 올라가면 문제가 길어지므로 몹이 나오는 간격만 아주 살짝 넉넉하게
  var gap = (g >= 5) ? 1.16 : (g === 4 ? 1.09 : 1);
  // 5세는 손으로 세면서 답할 수 있도록 하강 속도를 현재 속도의 0.7배로 (초1~초6은 그대로 1.30배)
  // 여기에 고른 속도(느림 0.75 / 보통 1.00 / 빠름 1.35)를 한 번 더 곱한다
  return { spawn: p.spawn * gap, speed: p.speed * speedScale() };
}

function modeType(){
  if(S.mode === 'mix') return Math.random() < 0.5 ? 'math' : 'word';
  return S.mode;
}

/* 정답 근처의 그럴듯한 오답 3가지 — 0 이상 정수, 정답과 겹치지 않게 */
function mathDistractors(ans){
  var a = Math.max(0, Math.round(ans));
  var out = [a];
  var steps;
  if(a < 10) steps = [1, 2, 3, -1, -2, 10];
  else if(a < 30) steps = [1, 2, 10, -1, -2, 20];
  else if(a < 100) steps = [1, 10, 2, -1, -10, 20];
  else if(a < 1000) steps = [10, 100, 1, -10, -100, 20];
  else steps = [100, 1000, 10, -100, -1000, 1];
  shuffle(steps);
  for(var i = 0; i < steps.length && out.length < 4; i++){
    var v = a + steps[i];
    if(v < 0 || out.indexOf(v) !== -1) continue;
    out.push(v);
  }
  var g = 3;
  while(out.length < 4 && g < 600){
    var cand = (Math.random() < 0.5) ? a + g : a - g;
    if(cand >= 0 && out.indexOf(cand) === -1) out.push(cand);
    g++;
  }
  return out;
}

function makeProblem(stage){
  if(modeType() === 'math'){
    var p = genMath(S.grade, stage);
    if(S.mathType === 'choice') p.choices = shuffle(mathDistractors(p.ans));
    return p;
  }
  return genWord(stage);
}

   ========================================================= */
function bestKey(mode, grade){ return 'gm_best_' + mode + '_g' + normGrade(grade); }
var LEGACY_BEST = { math:'gm_best_math', word:'gm_best_word', mix:'gm_best_mix' };
function bestOf(mode, grade){
  var v = Store.get(bestKey(mode, grade), null);
  if(v === null && grade === 1){
    var old = Store.get(LEGACY_BEST[mode], null);
    if(old !== null){ v = old; Store.set(bestKey(mode, 1), old); }
  }
  return v || 0;
}

function updateHud(){
  var full = Math.max(0, S.hearts);
  elHearts.textContent = new Array(full + 1).join('❤️') + new Array(5 - full + 1).join('🤍');
  elScore.textContent = S.score + '점';
  if(S.mode === 'word') elStage.textContent = '🔤 ' + S.stage + '단계';
  else elStage.textContent = gradeTag(S.grade) + ' · ' + S.stage + '단계';
  if(S.combo >= 2){ elCombo.hidden = false; elCombo.textContent = '🔥 x' + S.combo; }
  else elCombo.hidden = true;
}

function addScore(pts){
  S.score += pts;
  if(S.score > S.best){
    S.best = S.score;
    Store.set(bestKey(S.mode, S.grade), S.best);
  }
  updateHud();
}

    elHand.classList.remove('reloading');
    void elHand.offsetWidth;
    elHand.classList.add('reloading');

    elHero.classList.add('firing');
    clearTimeout(heroFire._g);
    heroFire._g = setTimeout(function(){ elHero.classList.remove('firing'); }, 640);
  }
}

function burst(x, y, opts){
  var o = opts || {};
  var n = o.count || 8;
  var chars = o.chars || ['⭐','✨','💥','💫'];
  var dist = o.dist || 60;
  for(var i=0;i<n;i++){
    var p = document.createElement('div');
    p.className = 'p';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.fontSize = (o.size || 15) + 'px';
    p.textContent = pick(chars);
    elFx.appendChild(p);
    var ang = (Math.PI * 2 * i / n) + Math.random() * 0.6;
    var d = dist * (0.55 + Math.random() * 0.75);
    var dx = Math.cos(ang) * d;
    var dy = Math.sin(ang) * d;
    try{
      var anim = p.animate(
        [
          { transform:'translate(-50%,-50%) scale(.4)', opacity:1 },
          { transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1.15)', opacity:0 }
        ],
        { duration: 380 + Math.random()*260, easing:'cubic-bezier(.2,.7,.4,1)' }
      );
      (function(node){ anim.onfinish = function(){ if(node.parentNode) node.parentNode.removeChild(node); }; })(p);
    }catch(e){ setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 500); }
  }
}

function floatText(x, y, text, cls){
  var d = document.createElement('div');
  d.className = 'flt' + (cls ? ' ' + cls : '');
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  d.textContent = text;
  elFx.appendChild(d);
  try{
    var anim = d.animate(
      [ { transform:'translate(-50%,-50%) scale(.6)', opacity:0 },
        { transform:'translate(-50%,-115%) scale(1.12)', opacity:1, offset:.35 },
        { transform:'translate(-50%,-190%) scale(1)', opacity:0 } ],
      { duration: 780, easing:'ease-out' }
    );
    anim.onfinish = function(){ if(d.parentNode) d.parentNode.removeChild(d); };
  }catch(e){ setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 800); }
}

/* =========================================================
   missile flight & impact
   ========================================================= */
var MISSILE_DUR = 0.40;   // 비행 시간(초)

function fxNode(cls, x, y, w, h){
  var d = document.createElement('div');
  d.className = cls;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  if(w){ d.style.width = w + 'px'; d.style.height = (h || w) + 'px'; }
  elFx.appendChild(d);
  return d;
}

function fxAnim(node, frames, dur, easing, delay){
  try{
    var a = node.animate(frames, { duration: dur, easing: easing || 'ease-out', delay: delay || 0, fill: 'both' });
    a.onfinish = function(){ if(node.parentNode) node.parentNode.removeChild(node); };
    return a;
  }catch(e){
    setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, (dur || 300) + (delay || 0) + 60);
    return null;
  }
}

function shockRing(x, y, size, dur, delay, color){
  var r = fxNode('shock', x, y, size);
  if(color){ r.style.borderColor = color; r.style.boxShadow = '0 0 14px ' + color + ',0 0 26px rgba(255,140,30,.7)'; }
  fxAnim(r, [
    { transform:'translate(-50%,-50%) scale(.22)', opacity:.95 },
    { transform:'translate(-50%,-50%) scale(1.05)', opacity:.8, offset:.55 },
    { transform:'translate(-50%,-50%) scale(1.45)', opacity:0 }
  ], dur, 'cubic-bezier(.15,.72,.28,1)', delay);
}

function monsterPoint(m){
  var fr = fieldRect();
  return { x: fr.width * m.x, y: fr.height * m.y };
}

function launchFx(sx, sy){
  var fl = fxNode('flashw', sx, sy, 72);
  fxAnim(fl, [
    { transform:'translate(-50%,-50%) scale(.3)', opacity:1 },
    { transform:'translate(-50%,-50%) scale(1.75)', opacity:0 }
  ], 260);
  shockRing(sx, sy, 44, 320, 0, '#ffe066');
  burst(sx, sy, { count: 7, dist: 34, size: 14, chars:['✨','💫','⭐'] });
}

function trailDot(x, y, ang){
  var d = document.createElement('div');
  d.className = 'mtrail';
  var sz = 4 + Math.random() * 5;
  d.style.left = (x + (Math.random()*9 - 4.5)) + 'px';
  d.style.top = (y + (Math.random()*9 - 4.5)) + 'px';
  d.style.width = sz.toFixed(1) + 'px';
  d.style.height = sz.toFixed(1) + 'px';
  var warm = Math.random();
  d.style.background = warm < 0.45 ? '#fff6b0' : (warm < 0.8 ? '#ffb01f' : '#ff7a1a');
  d.style.boxShadow = '0 0 ' + (6 + Math.random()*9).toFixed(0) + 'px rgba(255,160,40,.9)';
  elFx.appendChild(d);
  var back = ang + 180 + (Math.random()*46 - 23);
  var rad = back * Math.PI / 180;
  var dist = 10 + Math.random() * 24;
  var bx = Math.cos(rad) * dist, by = Math.sin(rad) * dist;
  fxAnim(d, [
    { transform:'translate(-50%,-50%) scale(1)', opacity:.95 },
    { transform:'translate(calc(-50% + ' + bx.toFixed(1) + 'px), calc(-50% + ' + by.toFixed(1) + 'px)) scale(.15)', opacity:0 }
  ], 280 + Math.random()*220);
}

function impactFx(x, y, power){
  var p = power || 1;
  var fr = fieldRect();
  var base = clamp(Math.min(fr.width, fr.height) * 0.34, 72, 168) * p;

  var fl = fxNode('flashw', x, y, base * 0.95);
  fxAnim(fl, [
    { transform:'translate(-50%,-50%) scale(.35)', opacity:1 },
    { transform:'translate(-50%,-50%) scale(1.05)', opacity:.85, offset:.35 },
    { transform:'translate(-50%,-50%) scale(1.5)', opacity:0 }
  ], 250);

  shockRing(x, y, base * 0.6, 430, 0, '#ffffff');
  shockRing(x, y, base * 0.85, 500, 55, '#ffd34d');

  burst(x, y, { count: Math.round(16 * p) + 2, dist: 92 * p, size: 17, chars:['💥','⭐','✨','🔥','💫'] });
  burst(x, y, { count: 5, dist: 44, size: 24, chars:['💥'] });
}

function fireLaser(m){
  var hp = heroPoint();
  var tp = monsterPoint(m);
  launchFx(hp.x, hp.y);
  Sfx.launch();
  heroFire();

  var core = fxNode('missile', hp.x, hp.y);
  var streak = fxNode('streak', hp.x, hp.y);
  streak.style.width = 'clamp(26px,9vw,48px)';

  S.missiles.push({
    m: m,
    el: core, st: streak,
    x0: hp.x, y0: hp.y,
    x: hp.x, y: hp.y,
    tx: tp.x, ty: tp.y,
    t: 0, dur: MISSILE_DUR,
    acc: 0,
    ang: Math.atan2(tp.y - hp.y, tp.x - hp.x) * 180 / Math.PI,
    arc: clamp(Math.abs(tp.y - hp.y) * 0.18, 14, 64)
  });
}

function clearMissiles(){
  for(var i=0;i<S.missiles.length;i++){
    var ms = S.missiles[i];
    if(!ms) continue;
    ms.done = true;
    if(ms.el && ms.el.parentNode) ms.el.parentNode.removeChild(ms.el);
    if(ms.st && ms.st.parentNode) ms.st.parentNode.removeChild(ms.st);
  }
  S.missiles = [];
  S.hitStop = 0;
}

function updateMissiles(dt){
  if(!S.missiles.length) return;
  var fr = fieldRect();
  var list = S.missiles.slice();
  for(var i = 0; i < list.length; i++){
    var ms = list[i];
    if(!ms || ms.done) continue;
    ms.t += dt;
    var p = ms.t / ms.dur;
    if(p > 1) p = 1;
    var e = Math.pow(p, 1.45);          // 살짝 가속하며 날아간다

    var tx = ms.tx, ty = ms.ty;
    if(ms.m && !ms.m.dead){
      tx = fr.width * ms.m.x;
      ty = fr.height * ms.m.y;
      ms.tx = tx; ms.ty = ty;
    }
    var nx = ms.x0 + (tx - ms.x0) * e;
    var ny = ms.y0 + (ty - ms.y0) * e - Math.sin(Math.PI * p) * ms.arc;

    var ddx = nx - ms.x, ddy = ny - ms.y;
    if(ddx || ddy) ms.ang = Math.atan2(ddy, ddx) * 180 / Math.PI;
    ms.x = nx; ms.y = ny;
    if(ms.el){ ms.el.style.left = nx + 'px'; ms.el.style.top = ny + 'px'; }

    if(ms.st){
      var rad = ms.ang * Math.PI / 180;
      ms.st.style.left = (nx - Math.cos(rad) * 17) + 'px';
      ms.st.style.top = (ny - Math.sin(rad) * 17) + 'px';
      ms.st.style.transform = 'translate(-50%,-50%) rotate(' + ms.ang.toFixed(1) + 'deg)';
      ms.st.style.opacity = (0.4 + p * 0.6).toFixed(2);
    }

    ms.acc += dt;
    while(ms.acc >= 0.024){
      ms.acc -= 0.024;
      trailDot(nx, ny, ms.ang);
    }

    if(p >= 1){
      ms.done = true;
      if(ms.el && ms.el.parentNode) ms.el.parentNode.removeChild(ms.el);
      if(ms.st && ms.st.parentNode) ms.st.parentNode.removeChild(ms.st);
      resolveHit(ms);
    }
  }

  // 끝난 미사일 정리 (resolveHit 안의 clearMissiles 가 배열을 바꿨을 수 있다)
  var keep = [];
  for(var j=0;j<S.missiles.length;j++){
    if(S.missiles[j] && !S.missiles[j].done) keep.push(S.missiles[j]);
  }
  S.missiles = keep;
}

function banner(main, sub, ms){
  elBanner.innerHTML = '';
  var b1 = document.createElement('div');
  b1.className = 'b1';
  b1.textContent = main;
  elBanner.appendChild(b1);
  if(sub){
    var b2 = document.createElement('div');
    b2.className = 'b2';
    b2.textContent = sub;
    elBanner.appendChild(b2);
  }
  elBanner.hidden = false;
  elBanner.classList.remove('show');
  void elBanner.offsetWidth;
  elBanner.classList.add('show');
  clearTimeout(banner._t);
  banner._t = setTimeout(function(){
    elBanner.classList.remove('show');
    elBanner.hidden = true;
  }, ms || 1900);
}

function shakeScreen(power){
  var app = document.getElementById('app');
  var p = clamp(power || 1, 0.5, 2);
  app.style.setProperty('--skx', (-6 * p).toFixed(1) + 'px');
  app.style.setProperty('--sky', (3.4 * p).toFixed(1) + 'px');
  app.style.setProperty('--skd', (0.24 + 0.08 * p).toFixed(2) + 's');
  app.classList.remove('shaking');
  void app.offsetWidth;
  app.classList.add('shaking');
  clearTimeout(shakeScreen._t);
  shakeScreen._t = setTimeout(function(){ app.classList.remove('shaking'); }, 420);
}

/* =========================================================
   panels
   ========================================================= */
function showPanelFor(prob){
  elPanelIdle.hidden = true;
  if(prob && prob.type === 'word'){
    elPanelMath.hidden = true;
    elPanelMathChoice.hidden = true;
    elPanelWord.hidden = false;
    elWEmoji.textContent = prob.emoji;
    if(prob.kind === 'missing'){ elWQ.innerHTML = prob.qhtml; elWQ.style.letterSpacing = '2px'; }
    else { elWQ.textContent = '❓'; elWQ.style.letterSpacing = '0'; }
    elWHint.textContent = prob.hint;
    var btns = elChoices.querySelectorAll('.ch');
    for(var i=0;i<btns.length;i++){
      var sp = btns[i].querySelector('span');
      sp.textContent = prob.choices[i];
      btns[i].classList.remove('bad');
      btns[i].style.visibility = prob.choices[i] ? 'visible' : 'hidden';
    }
  } else if(prob && prob.type === 'math'){
    elPanelWord.hidden = true;
    var useChoice = !!(prob.choices && prob.choices.length);
    elPanelMath.hidden = useChoice;
    elPanelMathChoice.hidden = !useChoice;
    var lines = prob.lines || [prob.text];
    var qEl = useChoice ? elQMathC : elQMath;
    qEl.innerHTML = '';
    for(var li=0;li<lines.length;li++){
      if(li) qEl.appendChild(document.createElement('br'));
      qEl.appendChild(document.createTextNode(lines[li]));
    }
    if(useChoice){
      var cbs = elMChoices.querySelectorAll('.ch');
      for(var ci=0;ci<cbs.length;ci++){
        var csp = cbs[ci].querySelector('span');
        var cv = prob.choices[ci];
        csp.textContent = (cv === undefined) ? '' : String(cv);
        cbs[ci].classList.remove('bad');
        cbs[ci].style.visibility = (cv === undefined) ? 'hidden' : 'visible';
      }
      fitChoiceQuestion(lines);
    } else {
      var ansDigits = String(prob.ans).length;
      elAnsBox.style.minWidth = Math.min(88, 24 + ansDigits * 14) + 'px';
      fitQuestion(lines);
      renderInput();
    }
  } else {
    elPanelMath.hidden = true;
    elPanelMathChoice.hidden = true;
    elPanelWord.hidden = true;
    elPanelIdle.hidden = false;
  }
}

function renderInput(){
  elAnsBox.textContent = S.input ? S.input : '?';
  if(S.input) elAnsBox.classList.add('typed');
  else elAnsBox.classList.remove('typed');
  elAnsBox.classList.remove('bad');
}

/* 문제가 길어도 숫자 입력창을 밀어내지 않게 문제 글자 크기를 맞춘다 */
function fitQuestion(lines){
  var bar = elQMath.parentNode;
  var barW = bar ? bar.getBoundingClientRect().width : 300;
  var ansW = elAnsBox.getBoundingClientRect().width || 60;
  var avail = Math.max(112, barW - ansW - 24);
  var base = Math.min(34, Math.max(20, window.innerWidth * 0.068));
  var px = fitFont(lines, avail, base, 13);
  elQMath.style.fontSize = px.toFixed(0) + 'px';
}

/* 객관식 판 — 보기 버튼 폭에 맞춰 문제 글자 크기를 맞춘다 */
function fitChoiceQuestion(lines){
  var bar = elQMathC.parentNode;
  var barW = bar ? bar.getBoundingClientRect().width : 300;
  var avail = Math.max(120, barW - 24);
  var base = Math.min(30, Math.max(19, window.innerWidth * 0.062));
  var px = fitFont(lines, avail, base, 12);
  elQMathC.style.fontSize = px.toFixed(0) + 'px';
}

function flashBad(){
  elAnsBox.classList.add('bad');
  setTimeout(function(){ elAnsBox.classList.remove('bad'); }, 380);
}

/* =========================================================
   monsters
   ========================================================= */
var LANES = 4;

function chooseX(){
  var counts = [];
  for(var i=0;i<LANES;i++) counts.push(0);
  for(var j=0;j<S.monsters.length;j++){
    var mx = S.monsters[j].x;
    var slot = Math.round((mx - 0.5 / LANES) * LANES);
    slot = clamp(slot, 0, LANES-1);
    counts[slot]++;
  }
  var best = 0;
  for(var k=1;k<LANES;k++){ if(counts[k] < counts[best]) best = k; }
  var laneX = 0.14 + ((best + 0.5) / LANES) * 0.72;
  return clamp(laneX + (Math.random()*0.06 - 0.03), 0.13, 0.87);
}

function bubbleTextOf(prob){
  if(prob.type === 'math') return prob.text;
  return prob.plain;
}

function bubbleMaxW(m){
  var fr = fieldRect();
  var edge = Math.min(m.x, 1 - m.x) * fr.width - 12;
  return Math.max(96, Math.min(fr.width * 0.62, edge * 2));
}
function bubbleBasePx(m){
  return m.boss ? Math.min(19, Math.max(13, window.innerWidth * 0.036))
                : Math.min(17, Math.max(11, window.innerWidth * 0.032));
}
/* 문제가 길어도 말풍선 밖으로 삐져나가지 않게 줄을 나우고 글자를 줄인다 */
function setBubbleText(bub, prob, m){
  var lines = (prob.type === 'math' && prob.lines) ? prob.lines : [bubbleTextOf(prob)];
  bub.innerHTML = '';
  for(var i=0;i<lines.length;i++){
    if(i) bub.appendChild(document.createElement('br'));
    bub.appendChild(document.createTextNode(lines[i]));
  }
  var px = fitFont(lines, bubbleMaxW(m), bubbleBasePx(m), 9);
  bub.style.fontSize = px.toFixed(0) + 'px';
}

function spawnMonster(isBoss){
  var par = stageParams(S.stage);
  var prob = makeProblem(S.stage);
  for(var tryN = 0; tryN < 6; tryN++){
    var ptxt = bubbleTextOf(prob);
    var dup = false;
    for(var mi = 0; mi < S.monsters.length; mi++){
      if(!S.monsters[mi].dead && bubbleTextOf(S.monsters[mi].prob) === ptxt){ dup = true; break; }
    }
    if(!dup) break;
    prob = makeProblem(S.stage);
  }
  var boss = null;
  if(isBoss){
    boss = bossInfo(S.stage);
  }

  var el = document.createElement('div');
  el.className = 'monster' + (isBoss ? ' boss' : '');

  if(isBoss){
    var nameEl = document.createElement('div');
    nameEl.className = 'bossname';
    nameEl.textContent = boss.crown + ' ' + boss.name;
    el.appendChild(nameEl);
  }

  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  el.appendChild(bubble);

  var body = document.createElement('div');
  body.className = 'body';
  body.textContent = isBoss ? boss.emoji : pick(MOB_EMOJI);
  el.appendChild(body);

  var hpFill = null;
  if(isBoss){
    var wrap = document.createElement('div');
    wrap.className = 'hpwrap';
    var bar = document.createElement('div');
    bar.className = 'hpbar';
    hpFill = document.createElement('div');
    hpFill.className = 'hpfill';
    hpFill.style.width = '100%';
    bar.appendChild(hpFill);
    wrap.appendChild(bar);
    el.appendChild(wrap);
  }

  var m = {
    id: S.nextId++,
    prob: prob,
    boss: !!isBoss,
    hp: isBoss ? boss.hp : 1,
    maxHp: isBoss ? boss.hp : 1,
    hpFill: hpFill,
    bossInfo: boss,
    x: isBoss ? 0.5 : chooseX(),
    y: isBoss ? -0.14 : -0.06,
    speed: isBoss ? (0.019 + Math.min(S.stage, 5) * 0.0016) * speedScale()
                  : (par.speed * (0.92 + Math.random()*0.22)),
    dead: false,
    el: el
  };

  el.style.left = (m.x * 100).toFixed(2) + '%';
  el.style.top = (m.y * 100).toFixed(2) + '%';
  setBubbleText(bubble, prob, m);

  el.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    if(!S.running || S.paused) return;
    if(m.dead || m.pending) return;
    setTarget(m, true);
    Sfx.tap();
  });

  elField.appendChild(el);
  S.monsters.push(m);
  return m;
}

function removeMonsterFromList(m){
  var i = S.monsters.indexOf(m);
  if(i >= 0) S.monsters.splice(i, 1);
}

function currentTarget(){
  for(var i=0;i<S.monsters.length;i++){
    if(S.monsters[i].id === S.targetId) return S.monsters[i];
  }
  return null;
}

function pickTarget(){
  var best = null;
  for(var i=0;i<S.monsters.length;i++){
    var m = S.monsters[i];
    if(m.dead || m.pending) continue;
    if(!best || m.y > best.y) best = m;
  }
  return best;
}

function setTarget(m, manual){
  if(m && m.pending) m = null;
  S.targetId = m ? m.id : null;
  S.manual = !!(m && manual);
  S.input = '';
  for(var i=0;i<S.monsters.length;i++){
    var mm = S.monsters[i];
    if(m && mm.id === m.id) mm.el.classList.add('target');
    else mm.el.classList.remove('target');
  }
  showPanelFor(m ? m.prob : null);
  renderInput();
}

/* =========================================================
   answering
   ========================================================= */
var lockUntil = 0;

function pressDigit(d){
  var t = currentTarget();
  if(!t || t.prob.type !== 'math') return;
  if(Date.now() < lockUntil) return;
  var ansStr = String(t.prob.ans);
  if(S.input.length >= ansStr.length) S.input = '';
  S.input += d;
  renderInput();

  if(S.input.length >= ansStr.length){
    if(S.input === ansStr){
      hitTarget();
    } else {
      failAnswer('앗!');
    }
  }
}

function submitMath(){
  var t = currentTarget();
  if(!t) return;
  if(!S.input){ flashBad(); Sfx.wrong(); return; }
  if(S.input === String(t.prob.ans)) hitTarget();
  else failAnswer('앗!');
}

function chooseWord(i){
  var t = currentTarget();
  if(!t || t.prob.type !== 'word') return;
  if(!t.prob.choices[i]) return;
  if(t.prob.choices[i] === t.prob.answer){
    hitTarget();
  } else {
    var btns = elChoices.querySelectorAll('.ch');
    if(btns[i]){
      btns[i].classList.add('bad');
      setTimeout(function(){ btns[i].classList.remove('bad'); }, 400);
    }
    failAnswer('앗!');
  }
}

function chooseMathChoice(i){
  var t = currentTarget();
  if(!t || t.prob.type !== 'math' || !t.prob.choices) return;
  if(Date.now() < lockUntil) return;
  var v = t.prob.choices[i];
  if(v === undefined || v === null) return;
  if(v === t.prob.ans){
    hitTarget();
  } else {
    var btns = elMChoices.querySelectorAll('.ch');
    if(btns[i]){
      btns[i].classList.add('bad');
      setTimeout(function(){ if(btns[i]) btns[i].classList.remove('bad'); }, 400);
    }
    failAnswer('앗!');
  }
}

function failAnswer(word){
  S.combo = 0;
  S.input = '';
  updateHud();
  renderInput();
  flashBad();
  Sfx.wrong();
  lockUntil = Date.now() + 280;
  var hp = heroPoint();
  floatText(hp.x, hp.y - 40, word || '앗!');
}

function hitTarget(){
  var m = currentTarget();
  if(!m || m.dead || m.pending) return;

  S.combo++;
  var pts = 10 + Math.min(S.combo - 1, 5) * 2;
  addScore(pts);
  Sfx.correct(S.combo);

  // 미사일을 발사하고, 명중은 도착했을 때 처리한다
  m.pending = true;
  m.pendingPts = pts;
  m.pendingCombo = S.combo;
  m.el.classList.add('pending');
  fireLaser(m);

  // 날아가는 동안에도 아이가 바로 다음 문제를 풀 수 있게 타겟을 넘긴다
  var nt = pickTarget();
  setTarget(nt);
}

function resolveHit(ms){
  var m = ms.m;
  var hx = ms.x, hy = ms.y;
  if(!m || m.dead || !S.running || S.stageDone) return;

  m.pending = false;
  m.el.classList.remove('pending');

  var pts = m.pendingPts || 10;
  var combo = m.pendingCombo || S.combo;
  var power = m.boss ? 1.5 : (combo >= 5 ? 1.25 : 1);

  impactFx(hx, hy, power);
  Sfx.impact(power);
  shakeScreen(power);
  S.hitStop = m.boss ? 0.10 : 0.06;

  m.el.classList.remove('impact');
  void m.el.offsetWidth;
  m.el.classList.add('impact');
  setTimeout(function(){ m.el.classList.remove('impact'); }, 360);

  floatText(hx, hy - 18, '+' + pts + (combo >= 2 ? ' 🔥' : ''), combo >= 5 ? 'big' : '');

  if(m.boss){
    m.hp--;
    if(m.hpFill) m.hpFill.style.width = Math.max(0, (m.hp / m.maxHp) * 100) + '%';
    m.y = clamp(m.y - 0.06, -0.05, 0.86);
    m.el.style.top = (m.y * 100).toFixed(2) + '%';
    if(m.hp <= 0){ defeatBoss(m); return; }
    m.prob = makeProblem(S.stage);
    var bub = m.el.querySelector('.bubble');
    if(bub) setBubbleText(bub, m.prob, m);
    if(!currentTarget()) setTarget(m);
  } else {
    m.dead = true;
    S.kills++;
    m.el.classList.remove('target');
    m.el.classList.add('die');
    m.el.style.pointerEvents = 'none';
    setTimeout(function(){ if(m.el.parentNode) m.el.parentNode.removeChild(m.el); }, 360);
    removeMonsterFromList(m);
    if(S.targetId === m.id) setTarget(pickTarget());
    if(combo === 5 || combo === 10 || combo === 15){
      var nc = heroName ? heroName + ' ' : '';
      var cm = (combo === 5) ? nc + '최고! ' + combo + '콤보!'
             : (combo === 10) ? nc + '멋지다! ' + combo + '콤보!'
             : nc + '최강! ' + combo + '콤보!';
      floatText(hx, hy - 55, cm, 'big');
    }
    if(S.kills >= S.needKills && !S.bossActive && !S.stageDone){
      scheduleBoss();
    }
  }
}

function hitWall(m){
  if(m.dead || m.pending) return;
  m.dead = true;

  S.hearts--;
  S.combo = 0;
  updateHud();
  Sfx.hurt();
  shakeScreen();

  var fr = fieldRect();
  burst(fr.width * m.x, fr.height * 0.9, { count: 10, dist: 55, size: 16, chars:['💔','💥','😵'] });

  if(m.boss){
    m.y = 0.18;
    m.el.style.top = '18%';
    m.dead = false;   // boss keeps going
    floatText(fr.width * m.x, fr.height * 0.82, '💔 하트 -1', 'big');
  } else {
    m.el.classList.add('gone');
    m.el.style.pointerEvents = 'none';
    setTimeout(function(){ if(m.el.parentNode) m.el.parentNode.removeChild(m.el); }, 320);
    removeMonsterFromList(m);
    if(S.targetId === m.id) setTarget(pickTarget());
    floatText(fr.width * m.x, fr.height * 0.82, '💔 하트 -1', 'big');
  }

  if(S.hearts <= 0) gameOver();
}

/* =========================================================
   game loop
   ========================================================= */
function startLoop(){
  S.ts = 0;
  S.running = true;
  requestAnimationFrame(loop);
}

function loop(ts){
  if(!S.running) return;
  var prev = S.ts || ts;
  S.ts = ts;
  var dt = clamp((ts - prev) / 1000, 0, 0.05);
  if(!S.paused) update(dt);
  requestAnimationFrame(loop);
}

function update(dt){
  var par = stageParams(S.stage);

  // 명중 순간의 짧은 정지(hit-stop) — 타격감을 위해 게임을 아주 잠깐 멈춘다
  if(S.hitStop > 0){
    S.hitStop = Math.max(0, S.hitStop - dt);
    return;
  }

  updateMissiles(dt);

  if(!S.bossActive && !S.stageDone && S.monsters.length < 7){
    S.spawnT -= dt;
    if(S.spawnT <= 0){
      spawnMonster(false);
      S.spawnT = par.spawn;
    }
  } else {
    S.spawnT = 0.6;
  }

  var list = S.monsters.slice();
  for(var i=0;i<list.length;i++){
    var m = list[i];
    if(m.dead) continue;
    if(m.pending){
      // 이미 미사일이 날아가는 중 — 성까지 오지 않고 그 자리에서 맞기를 기다린다
      if(m.y < 0.86) m.y += m.speed * dt;
    } else {
      m.y += m.speed * dt;
    }
    m.el.style.left = (m.x * 100).toFixed(2) + '%';
    m.el.style.top = (m.y * 100).toFixed(2) + '%';
    if(!m.pending && m.y >= 0.895){
      hitWall(m);
      if(!S.running) return;
    }
  }

  var t = currentTarget();
  if(!t){
    var nt = pickTarget();
    if(nt) setTarget(nt);
  } else if(!S.input && !S.manual){
    var best = pickTarget();
    if(best && best.id !== t.id && best.y > t.y + 0.07){
      setTarget(best);
    }
  }
}

document.addEventListener('keydown', function(ev){
  if(elGame.hidden) return;
  var k = ev.key;
  if(S.paused){
    if(k === 'Escape' || k === ' ') { ev.preventDefault(); }
    return;
  }
  if(!S.running) return;
  if(k === 'Escape'){ ev.preventDefault(); togglePause(); return; }
  var t = currentTarget();
  if(!t) return;

  if(t.prob.type === 'math'){
    if(t.prob.choices && t.prob.choices.length){
      if(k >= '1' && k <= '4' && k.length === 1){ ev.preventDefault(); Sfx.unlock(); chooseMathChoice(parseInt(k,10) - 1); }
      return;
    }
    if(k >= '0' && k <= '9' && k.length === 1){ ev.preventDefault(); Sfx.unlock(); pressDigit(k); }
    else if(k === 'Backspace'){ ev.preventDefault(); S.input = S.input.slice(0, -1); renderInput(); }
    else if(k === 'Enter'){ ev.preventDefault(); submitMath(); }
  } else {
    if(k >= '1' && k <= '4' && k.length === 1){ ev.preventDefault(); Sfx.unlock(); chooseWord(parseInt(k,10) - 1); }
  }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden && S.running && !S.paused && !elGame.hidden) togglePause();
